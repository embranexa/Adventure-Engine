<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Vessels</title>
<!--
  Prototype: making the heart's liquid read as liquid/energy (effects 1, 3, 4, 7).
  Left: today's liquid (machines.js liquidMat + flat top). Right: the new one.
  Rule: every band keeps its own hue; effects only change brightness/alpha, and anything
  moving takes the colour of the band it is in, so the lens stays readable.
-->
<style>
  :root { --bg0: #07090d; --bg1: #121722; --ink: #d8dee8; --dim: #8a93a3; --line: #2a3140; --gilt: #d9b56a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(ellipse at 50% 35%, var(--bg1), var(--bg0) 70%); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .ui { position: fixed; top: 12px; right: 12px; width: 260px; padding: 12px 14px; background: rgba(12, 15, 22, .82); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(6px); }
  .ui h1 { margin: 0 0 2px; font-size: 14px; color: var(--gilt); letter-spacing: .04em; }
  .ui p { margin: 0 0 10px; color: var(--dim); font-size: 12px; }
  .ui label { display: flex; align-items: center; gap: 8px; margin: 6px 0; cursor: pointer; }
  .ui label.sub { margin-left: 24px; color: var(--dim); }
  .ui input[type=range] { flex: 1; accent-color: var(--gilt); }
  .ui input[type=checkbox] { accent-color: var(--gilt); }
  .ui select, .ui button { width: 100%; margin: 4px 0; padding: 5px 8px; background: #1a2030; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; font: inherit; cursor: pointer; }
  .ui button:hover, .ui select:hover { border-color: var(--gilt); }
  .ui hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
  .ui .row { display: flex; gap: 6px; } .ui .row button { flex: 1; }
  .tag { position: fixed; transform: translate(-50%, 0); color: var(--dim); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; pointer-events: none; white-space: nowrap; }
  .legend { position: fixed; left: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px 12px; max-width: calc(100vw - 300px); color: var(--dim); font-size: 12px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  @media (max-width: 640px) { .ui { left: 16px; right: 16px; width: auto; top: auto; bottom: 12px; max-height: 45vh; overflow: auto; } .legend { display: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="tag" id="tag0">Current</div>
<div class="tag" id="tag1">New</div>
<div class="legend" id="legend"></div>
<aside class="ui">
  <h1>Liquid vessels</h1>
  <p>Left: today's liquid. Right: with the effects below. Drag to orbit, scroll to zoom.</p>
  <label><input type="checkbox" id="fx-flow" checked> 1 · Moving brightness</label>
  <label class="sub">strength <input type="range" id="shimmer" min="0" max="0.6" step="0.02" value="0.28"></label>
  <label><input type="checkbox" id="fx-seams" checked> 3 · Glowing seams</label>
  <label><input type="checkbox" id="fx-surface" checked> 4 · Living surface</label>
  <label><input type="checkbox" id="fx-motes" checked> 7 · Rising motes</label>
  <hr>
  <select id="lens">
    <option value="matter">Lens: Matter (core stages)</option>
    <option value="type">Lens: Type</option>
    <option value="palette">Lens: many values (palette)</option>
    <option value="dull">Hard case: dull, similar colours</option>
    <option value="one">One band</option>
  </select>
  <label>Fill <input type="range" id="fill" min="0.05" max="1" step="0.01" value="0.72"></label>
  <label><input type="checkbox" id="ghost" checked> Ghosts on top (filtered out)</label>
  <label><input type="checkbox" id="busy"> Panel in use (machine working)</label>
  <div class="row"><button id="packet">Packet arrives</button><button id="shuffle">Shuffle counts</button></div>
  <label><input type="checkbox" id="compare" checked> Show current vessel</label>
</aside>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------- lens presets (real app colours: lifecycle.js, lens.js) ---------- */
const LENSES = {
    matter: [['Ore', '#3d7bf0'], ['Essence', '#1fc2c9'], ['Distillate', '#e9c43b'], ['Alloy', '#f28a2e'], ['Animus', '#ef3e4a']],
    type: [['Event', '#4fb3ff'], ['Item', '#e0a43a'], ['Song', '#c86bf0']],
    palette: ['#4fb3ff', '#3ccf8e', '#f2b134', '#f0643c', '#c86bf0', '#2fd2c9', '#ff7aa8'].map((c, i) => [`Value ${i + 1}`, c]),
    dull: [['Flux', '#3a4a5e'], ['Prima materia', '#4b5a86'], ['Dross', '#5d6070'], ['Vestige', '#6e4a4a'], ['Relic', '#7a6a55']],
    one: [['Essence', '#1fc2c9']],
};

/* ---------- renderer, camera, light: as in twinScene.js ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -4000, 4000);
const VIEW_DIR = new THREE.Vector3(0.55, 0.85, 1.15).normalize();
const TARGET = new THREE.Vector3(0, 9.5, 0);
camera.position.copy(VIEW_DIR).multiplyScalar(400).add(TARGET);
camera.zoom = 1;
const controls = new OrbitControls(camera, canvas);
controls.target.copy(TARGET);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2 - 0.05;
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.75;
scene.add(new THREE.HemisphereLight(0x9fb4d0, 0x1a1208, 0.5));
const key = new THREE.DirectionalLight(0xffe2b8, 1.6); key.position.set(150, 260, 120); scene.add(key);
const rim = new THREE.DirectionalLight(0x6fb8ff, 0.7); rim.position.set(-200, 120, -220); scene.add(rim);

const HALF = 21;
function resize() {
    const w = innerWidth, h = innerHeight, a = w / h;
    renderer.setSize(w, h, false);
    camera.left = -HALF * a; camera.right = HALF * a; camera.top = HALF; camera.bottom = -HALF;
    camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* ---------- shared materials (machines.js) ---------- */
const std = (o) => new THREE.MeshStandardMaterial({ envMapIntensity: 1, ...o });
const M = {
    brass: std({ color: 0xb5893f, metalness: 1, roughness: 0.32 }),
    gilt: std({ color: 0xe0b25a, metalness: 1, roughness: 0.22 }),
    iron: std({ color: 0x1b1d22, metalness: 0.6, roughness: 0.55 }),
    heart: std({ color: 0xd4e6f2, metalness: 0, roughness: 0.03, transparent: true, opacity: 0.1, depthWrite: false, side: THREE.DoubleSide, envMapIntensity: 0.8 }),
    ghost: std({ color: 0x2a2f38, metalness: 0, roughness: 0.3, transparent: true, opacity: 0.6, depthWrite: false }),
};
const lighter = (c, k = 0.35) => new THREE.Color(c).lerp(new THREE.Color('#ffffff'), k);
const unitCyl = new THREE.CylinderGeometry(1, 1, 1, 48); unitCyl.translate(0, 0.5, 0);

/* ---------- shader pieces ---------- */
const U = {   // shared by every new-style material
    uFlowT: { value: 0 }, uShimmer: { value: 0.28 },
    uWaveT: { value: 0 }, uWave: { value: 0.45 }, uHit: { value: -100 }, uTime: { value: 0 },
};
const NOISE = /* glsl */`
float hash3(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float vnoise(vec3 x) {
    vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(mix(hash3(i), hash3(i + vec3(1,0,0)), f.x), mix(hash3(i + vec3(0,1,0)), hash3(i + vec3(1,1,0)), f.x), f.y),
               mix(mix(hash3(i + vec3(0,0,1)), hash3(i + vec3(1,0,1)), f.x), mix(hash3(i + vec3(0,1,1)), hash3(i + vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm(vec3 p) { float a = 0.5, s = 0.0; for (int i = 0; i < 4; i++) { s += a * vnoise(p); p = p * 2.03 + vec3(1.7, 9.2, 3.1); a *= 0.5; } return s; }
uniform float uFlowT, uShimmer;
// (1) brightness only: the band's hue is never touched
float flowGain(vec3 p) {
    vec3 q = p * 0.30;
    float n1 = fbm(vec3(q.x, q.y * 0.7 - uFlowT * 0.35, q.z));                  // slow billows, rising
    float n2 = fbm(vec3(q.x * 2.4 + 3.0, q.y * 0.22 - uFlowT * 0.8, q.z * 2.4)); // fine upward streaks
    float n = clamp((0.6 * n1 + 0.4 * n2 - 0.46) * 2.8, -1.0, 1.0);
    return 1.0 + uShimmer * n;
}`;
const SURF = /* glsl */`
uniform float uWaveT, uWave, uHit, uTime, uR;
// (4) gentle crossing waves, a ripple ring after a packet lands, and a meniscus at the glass
float surfH(vec2 p) {
    float r = length(p), t = uWaveT;
    float h = uWave * 0.12 * (sin(dot(p, vec2(0.8, 0.6)) * 0.9 + t * 1.6) * 0.5
                            + sin(dot(p, vec2(-0.5, 0.86)) * 1.3 - t * 2.1) * 0.35
                            + sin(r * 1.7 - t * 2.4) * 0.25);
    float a = uTime - uHit;
    if (a > 0.0 && a < 6.0) h += 0.32 * sin(r * 2.6 - a * 7.0) * exp(-a * 0.9) * exp(-pow(r - a * 3.2, 2.0) * 0.5);
    h *= 1.0 - pow(min(r / uR, 1.0), 6.0);
    return h + 0.14 * smoothstep(uR - 0.7, uR, r);
}`;

/** Today's liquid material (machines.js liquidMat). */
const oldMats = new Map();
const oldLiquid = (c) => oldMats.get(c) ?? oldMats.set(c, std({ color: new THREE.Color(c).multiplyScalar(0.22), emissive: new THREE.Color(c), emissiveIntensity: 0.82, roughness: 0.4, metalness: 0, envMapIntensity: 0.2, toneMapped: false })).get(c);

/** Patch a standard material: world position for the flow noise, emissive *= flowGain. */
function withFlow(mat, extraVertex) {
    mat.onBeforeCompile = (sh) => {
        Object.assign(sh.uniforms, U, extraVertex?.uniforms ?? {});
        sh.vertexShader = sh.vertexShader
            .replace('#include <common>', `#include <common>\nvarying vec3 vWPos;\nvarying float vH;\n${extraVertex?.head ?? ''}`)
            .replace('#include <project_vertex>', `#include <project_vertex>\nvWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;`);
        if (extraVertex?.patch) sh.vertexShader = extraVertex.patch(sh.vertexShader);
        sh.fragmentShader = sh.fragmentShader
            .replace('#include <common>', `#include <common>\nvarying vec3 vWPos;\nvarying float vH;\n${NOISE}\n${extraVertex?.frag ?? ''}`)
            .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>\ntotalEmissiveRadiance *= ${extraVertex?.gain ?? 'flowGain(vWPos)'};`);
    };
    mat.customProgramCacheKey = () => (extraVertex ? 'surf' : 'flow');
    return mat;
}
const newMats = new Map();
const newLiquid = (c) => newMats.get(c) ?? newMats.set(c, withFlow(std({ color: new THREE.Color(c).multiplyScalar(0.22), emissive: new THREE.Color(c), emissiveIntensity: 0.82, roughness: 0.4, metalness: 0, envMapIntensity: 0.2, toneMapped: false }))).get(c);

/** (4) the living surface: a polar grid displaced in the vertex shader, normals from the slope. */
function surfaceMat(r) {
    const mat = std({ color: 0x000000, emissive: 0xffffff, emissiveIntensity: 0.95, roughness: 0.12, metalness: 0, envMapIntensity: 1.1, toneMapped: false });
    return withFlow(mat, {
        uniforms: { uR: { value: r } },
        head: SURF,
        patch: (v) => v
            .replace('#include <beginnormal_vertex>', `
                float e = 0.08;
                float h0 = surfH(position.xz);
                vec3 objectNormal = normalize(vec3(-(surfH(position.xz + vec2(e, 0.0)) - h0) / e, 1.0, -(surfH(position.xz + vec2(0.0, e)) - h0) / e));
                #ifdef USE_TANGENT
                vec3 objectTangent = vec3(tangent.xyz);
                #endif`)
            .replace('#include <begin_vertex>', 'vec3 transformed = vec3(position); transformed.y += h0; vH = h0;'),
        gain: 'flowGain(vWPos) * (1.0 + vH * 2.4)',   // crests a little brighter, troughs a little dimmer
    });
}

/** (3) a seam between two bands: lower half in the lower band's light, upper half in the upper's, a bright core between. */
const seamGeo = new THREE.CylinderGeometry(1, 1, 1, 64, 1, true);
function seamMat(low, high) {
    return new THREE.ShaderMaterial({
        uniforms: { cLow: { value: lighter(low, 0.3) }, cHigh: { value: lighter(high, 0.3) }, uTime: U.uTime },
        vertexShader: `varying vec2 vUv; varying vec3 vP; void main() { vUv = uv; vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
        fragmentShader: `
            uniform vec3 cLow, cHigh; uniform float uTime; varying vec2 vUv; varying vec3 vP;
            void main() {
                float d = abs(vUv.y - 0.5) * 2.0;
                float core = exp(-d * d * 22.0), halo = exp(-d * d * 3.5) * 0.35;
                vec3 c = vUv.y < 0.5 ? cLow : cHigh;
                float sparkle = 0.78 + 0.22 * sin(atan(vP.z, vP.x) * 5.0 - uTime * 1.6);
                gl_FragColor = vec4(mix(c, vec3(1.0), core * 0.5) * (core + halo) * sparkle, 1.0);
            }`,
        transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false,
    });
}

/** (7) motes rising through the lit liquid, each in the colour of the band it is passing. */
const MOTES = 150;
function motes(r) {
    const geo = new THREE.BufferGeometry();
    const seed = new Float32Array(MOTES * 4);
    for (let i = 0; i < MOTES; i++) seed.set([Math.random() * Math.PI * 2, Math.sqrt(Math.random()), Math.random(), 0.6 + Math.random() * 0.8], i * 4);
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(MOTES * 3), 3));
    geo.setAttribute('aSeed', new THREE.BufferAttribute(seed, 4));
    const mat = new THREE.ShaderMaterial({
        uniforms: {
            uClock: { value: 0 }, uTime: U.uTime, uLevel: { value: 0 }, uBase: { value: 0 }, uR: { value: r }, uPx: { value: 1 }, uSize: { value: 0.42 },
            uColors: { value: Array.from({ length: 8 }, () => new THREE.Color()) }, uTops: { value: new Array(8).fill(0) }, uCount: { value: 0 },
        },
        vertexShader: `
            uniform float uClock, uTime, uLevel, uBase, uR, uPx, uSize; uniform vec3 uColors[8]; uniform float uTops[8]; uniform int uCount;
            attribute vec4 aSeed; varying vec3 vCol; varying float vFade;
            void main() {
                float L = max(uLevel, 0.001);
                float h = mod(aSeed.z * 40.0 + uClock * aSeed.w, L);
                float ang = aSeed.x + 0.4 * sin(uTime * 0.8 + aSeed.z * 20.0) + h * 0.15;
                float rad = aSeed.y * uR * 0.86;
                vec3 p = vec3(cos(ang) * rad, uBase + h, sin(ang) * rad);
                vec3 col = uColors[0];
                for (int i = 0; i < 8; i++) { if (i >= uCount) break; col = uColors[i]; if (h < uTops[i]) break; }
                vCol = col;
                vFade = smoothstep(0.0, 0.7, h) * (1.0 - smoothstep(L - 0.9, L - 0.1, h)) * step(0.3, uLevel);
                gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
                gl_PointSize = uSize * uPx * (0.55 + 0.9 * fract(aSeed.z * 13.7));
            }`,
        fragmentShader: `
            varying vec3 vCol; varying float vFade;
            void main() {
                float r = length(gl_PointCoord - 0.5); if (r > 0.5) discard;
                float core = smoothstep(0.22, 0.0, r), soft = smoothstep(0.5, 0.0, r);
                gl_FragColor = vec4(mix(vCol, vec3(1.0), 0.3 + 0.45 * core) * (soft * 0.55 + core * 0.6) * vFade, 1.0);
            }`,
        transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false,
    });
    const pts = new THREE.Points(geo, mat);
    pts.frustumCulled = false; pts.renderOrder = 10;
    return pts;
}

/* ---------- a vessel: plinth, glass heart, brass bands, liquid ---------- */
const HEART = { r: 5.6, h: 12, y: 3.4 + 1.2 };
class Vessel {
    constructor(x, fancy) {
        this.fancy = fancy;
        this.group = new THREE.Group(); this.group.position.x = x; scene.add(this.group);
        const { r, h, y } = HEART, g = this.group;
        this.rr = r - 0.35; this.y0 = y + 0.2; this.maxH = h - 0.4;
        const mesh = (geo, mat, py = 0) => { const m = new THREE.Mesh(geo, mat); m.position.y = py; g.add(m); return m; };
        mesh(new THREE.CylinderGeometry(8, 8.6, 3.4, 48), M.iron, 1.7);
        mesh(new THREE.TorusGeometry(8, 0.22, 10, 64), M.gilt, 3.4).rotation.x = Math.PI / 2;
        mesh(new THREE.CylinderGeometry(r + 0.6, r + 1.1, 1.2, 48), M.brass, 3.4 + 0.6);
        mesh(new THREE.CylinderGeometry(r, r, h, 48, 1, true), M.heart, y + h / 2);
        for (const by of [y + 0.6, y + h - 0.4]) {
            mesh(new THREE.CylinderGeometry(r + 0.3, r + 0.3, 0.8, 48, 1, true), M.brass, by);
            for (const s of [-0.4, 0.4]) mesh(new THREE.TorusGeometry(r + 0.3, 0.16, 8, 64), M.gilt, by + s).rotation.x = Math.PI / 2;
        }

        this.liquid = new THREE.Group(); this.liquid.position.y = this.y0; g.add(this.liquid);
        this.overlay = new THREE.Group(); g.add(this.overlay);   // not scaled with the liquid: seams, surface, motes
        const flat = new THREE.CircleGeometry(this.rr * 0.98, 48); flat.rotateX(-Math.PI / 2);
        this.flatMat = std({ color: 0x000000, emissive: 0xffffff, emissiveIntensity: 0.95, roughness: 0.4, toneMapped: false });
        this.flatTop = new THREE.Mesh(flat, this.flatMat); this.overlay.add(this.flatTop);
        if (fancy) {
            const grid = new THREE.RingGeometry(0.001, this.rr * 0.995, 96, 28); grid.rotateX(-Math.PI / 2);
            this.surfMat = surfaceMat(this.rr);
            this.surface = new THREE.Mesh(grid, this.surfMat); this.overlay.add(this.surface);
            this.menMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false });
            this.meniscus = new THREE.Mesh(new THREE.TorusGeometry(this.rr - 0.02, 0.09, 8, 96), this.menMat);
            this.meniscus.rotation.x = Math.PI / 2; this.overlay.add(this.meniscus);
            this.motes = motes(this.rr); g.add(this.motes);
        }
        this.segs = []; this.seams = []; this.fill = 0; this.target = 0;
    }
    setBands(bands, ghost, fill) {
        for (const s of this.segs.splice(0)) this.liquid.remove(s);
        for (const s of this.seams.splice(0)) { this.overlay.remove(s.mesh); s.mesh.material.dispose(); }
        const all = [...bands.map((b) => ({ ...b })), ...(ghost ? [{ color: null, count: ghost, ghost: true }] : [])];
        const sum = all.reduce((n, b) => n + b.count, 0) || 1;
        let y = 0; this.lit = [];
        for (const b of all) {
            const share = b.count / sum; if (share <= 0) continue;
            const m = new THREE.Mesh(unitCyl, b.ghost ? M.ghost : (this.fancy ? newLiquid(b.color) : oldLiquid(b.color)));
            const rs = this.rr * (b.ghost ? 0.995 : 1);
            m.position.y = y; m.scale.set(rs, share, rs);
            this.liquid.add(m); this.segs.push(m);
            if (!b.ghost) this.lit.push({ color: b.color, top: y + share });
            y += share;
        }
        this.litShare = this.lit.at(-1)?.top ?? 0;
        if (this.fancy) for (let i = 0; i + 1 < this.lit.length; i++) {
            const mesh = new THREE.Mesh(seamGeo, seamMat(this.lit[i].color, this.lit[i + 1].color));
            mesh.scale.set(this.rr + 0.04, 0.26, this.rr + 0.04); this.overlay.add(mesh);
            this.seams.push({ mesh, at: this.lit[i].top });
        }
        const topColor = this.lit.at(-1)?.color ?? '#000000';
        this.flatMat.emissive.set(topColor);
        if (this.fancy) { this.surfMat.emissive.set(topColor); this.menMat.color.copy(lighter(topColor, 0.45)); }
        this.target = fill;
    }
    frame(dt, fx) {
        this.fill += (this.target - this.fill) * Math.min(1, dt * 3);
        const H = Math.max(0.001, this.fill * this.maxH);
        this.liquid.scale.y = H; this.liquid.visible = this.fill > 0.002;
        const litY = this.y0 + this.litShare * H;
        const has = this.litShare > 0;
        this.flatTop.position.y = litY + 0.002;
        this.flatTop.visible = has && !(this.fancy && fx.surface);
        if (!this.fancy) return;
        this.surface.visible = this.meniscus.visible = has && fx.surface;
        this.surface.position.y = litY; this.meniscus.position.y = litY + 0.14;
        for (const s of this.seams) { s.mesh.visible = fx.seams; s.mesh.position.y = this.y0 + s.at * H; }
        const u = this.motes.material.uniforms;
        this.motes.visible = fx.motes && has;
        u.uBase.value = this.y0; u.uLevel.value = this.litShare * H; u.uCount.value = this.lit.length;
        this.lit.forEach((b, i) => { if (i < 8) { u.uColors.value[i].set(b.color); u.uTops.value[i] = b.top * H; } });
        u.uPx.value = renderer.domElement.height / ((camera.top - camera.bottom) / camera.zoom);
    }
}

const before = new Vessel(-9, false), after = new Vessel(9, true);

/* ---------- state & UI ---------- */
const $ = (id) => document.getElementById(id);
const state = { counts: [], ghost: 0 };
const fx = () => ({ seams: $('fx-seams').checked, surface: $('fx-surface').checked, motes: $('fx-motes').checked });
function shuffle() {
    const lens = LENSES[$('lens').value];
    state.counts = lens.map(() => 2 + Math.round(Math.random() * 10));
    state.ghost = 3 + Math.round(Math.random() * 6);
    apply();
}
function apply() {
    const lens = LENSES[$('lens').value];
    const bands = lens.map(([, color], i) => ({ color, count: state.counts[i] }));
    const ghost = $('ghost').checked ? state.ghost : 0;
    const fill = +$('fill').value;
    before.setBands(bands, ghost, fill); after.setBands(bands, ghost, fill);
    $('legend').innerHTML = lens.map(([label, c]) => `<span><i style="background:${c}"></i>${label}</span>`).join('');
}
$('lens').onchange = shuffle;
$('shuffle').onclick = shuffle;
$('ghost').onchange = apply;
$('fill').oninput = apply;
$('compare').onchange = () => { before.group.visible = $('compare').checked; $('tag0').style.display = $('compare').checked ? '' : 'none'; };
$('packet').onclick = () => {
    const i = Math.floor(Math.random() * state.counts.length);
    state.counts[i] += 1 + Math.round(Math.random() * 2);
    $('fill').value = Math.min(1, +$('fill').value + 0.02);
    apply();
    U.uHit.value = U.uTime.value;
};
shuffle();

/* ---------- loop ---------- */
const clock = new THREE.Clock();
let pace = 0;
const tagPos = new THREE.Vector3();
function placeTag(el, v) {
    tagPos.set(v.group.position.x, 0, 0).project(camera);
    el.style.left = `${(tagPos.x * 0.5 + 0.5) * innerWidth}px`;
    el.style.top = `${(-tagPos.y * 0.5 + 0.5) * innerHeight + 18}px`;
}
renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.1);
    pace += (($('busy').checked ? 1 : 0) - pace) * Math.min(1, dt * 2);
    U.uTime.value += dt;
    U.uFlowT.value += dt * (1 + 0.8 * pace);
    U.uWaveT.value += dt * (1 + 0.8 * pace);
    U.uWave.value = 0.45 + 1.1 * pace;
    U.uShimmer.value = $('fx-flow').checked ? +$('shimmer').value : 0;
    after.motes.material.uniforms.uClock.value += dt * (0.5 + 1.4 * pace);
    const f = fx();
    before.frame(dt, f); after.frame(dt, f);
    controls.update();
    renderer.render(scene, camera);
    placeTag($('tag0'), before); placeTag($('tag1'), after);
});
</script>
</body>
</html>
