<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Stratified Sankey - Homogenizer Prototype</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Share+Tech+Mono&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0908;
            font-family: 'Share Tech Mono', monospace;
            color: #d4af37;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Steampunk Brass HUD */
        #hud-header {
            position: absolute;
            top: 18px;
            left: 24px;
            pointer-events: none;
            border-left: 4px solid #c88a32;
            padding: 8px 16px;
            background: linear-gradient(90deg, rgba(35, 24, 14, 0.88) 0%, rgba(15, 10, 6, 0) 100%);
        }

        h1 {
            font-family: 'Cinzel', serif;
            margin: 0;
            font-size: 1.6rem;
            letter-spacing: 2px;
            color: #f3c677;
            text-shadow: 0 2px 10px rgba(200, 138, 50, 0.5);
        }

        .subtitle {
            color: #a8947b;
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            margin-top: 3px;
        }

        #controls-bar {
            position: absolute;
            bottom: 18px;
            left: 24px;
            pointer-events: none;
            font-size: 0.8rem;
            color: #b5a288;
            background: rgba(20, 15, 11, 0.88);
            border: 1px solid #7c5826;
            padding: 8px 14px;
            border-radius: 3px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
        }

        #controls-bar span {
            color: #f3c677;
            font-weight: bold;
        }

        /* Vessel Label (3D Projected) */
        .vessel-label {
            position: absolute;
            pointer-events: none;
            font-size: 0.78rem;
            color: #fce8c3;
            background: rgba(22, 16, 11, 0.9);
            border: 1px solid #b8860b;
            padding: 3px 8px;
            border-radius: 3px;
            white-space: nowrap;
            transform: translate(-50%, -100%);
            box-shadow: 0 2px 8px rgba(0,0,0,0.85);
            z-index: 10;
        }

        .vessel-label .pkt-count {
            color: #f3c677;
            font-weight: bold;
            font-size: 0.75rem;
            margin-left: 6px;
        }

        /* Flow Pipe Label (3D Projected) */
        .flow-label {
            position: absolute;
            pointer-events: none;
            font-size: 0.72rem;
            color: #d8c3a5;
            background: rgba(10, 8, 7, 0.85);
            border: 1px dashed rgba(200, 138, 50, 0.6);
            padding: 2px 6px;
            border-radius: 10px;
            white-space: nowrap;
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        /* Hover Inspection Tooltip */
        #tooltip {
            position: absolute;
            display: none;
            pointer-events: none;
            background: rgba(24, 18, 12, 0.96);
            border: 1px solid #d4af37;
            box-shadow: 0 0 20px rgba(0,0,0,0.95), inset 0 0 10px rgba(212, 175, 55, 0.15);
            padding: 10px 14px;
            border-radius: 4px;
            min-width: 230px;
            z-index: 100;
            transform: translate(15px, -50%);
        }

        #tooltip h3 {
            font-family: 'Cinzel', serif;
            margin: 0 0 6px 0;
            font-size: 0.95rem;
            color: #f3c677;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 4px;
        }

        .tt-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            margin: 4px 0;
            color: #cbb89d;
        }

        .tt-val {
            color: #fff;
            font-weight: bold;
        }

        .layer-bar {
            display: flex;
            align-items: center;
            font-size: 0.74rem;
            margin-top: 3px;
            color: #e8dccb;
        }

        .layer-swatch {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            margin-right: 6px;
            display: inline-block;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="hud-header">
        <h1>Many-to-One Stratified Sankey Prototype</h1>
        <div class="subtitle">IMMISCIBLE LIQUID BANDS &bull; AREA-PROPORTIONAL PIPE GAUGE (r &prop; &radic;FLOW)</div>
    </div>

    <div id="controls-bar">
        <span>[L-CLICK + DRAG]</span> Orbit 3D &nbsp;|&nbsp; 
        <span>[SCROLL]</span> Zoom In/Out &nbsp;|&nbsp; 
        <span>[R-CLICK + DRAG]</span> Pan &nbsp;|&nbsp; 
        <span>[HOVER VESSEL / LAYER]</span> Inspect Composition
    </div>

    <div id="tooltip">
        <h3 id="tt-name">[vessel]</h3>
        <div class="tt-row"><span>ROLE:</span> <span class="tt-val" id="tt-role">Extractor</span></div>
        <div class="tt-row"><span>TOTAL PACKETS:</span> <span class="tt-val" id="tt-pkts">0</span></div>
        <div class="tt-row"><span>VESSEL BORE:</span> <span class="tt-val" id="tt-bore">Standard</span></div>
        <div id="tt-layers"></div>
    </div>

    <div id="labels-layer"></div>
    <div id="canvas-container"></div>

    <script>
        // =========================================================================
        // 1. MANY-TO-ONE SANKEY TOPOLOGY & STRATIFIED LAYER DATA
        //    Pipe Radius Formula: r = k * sqrt(flow) -> Solves the 3D Radius Illusion
        // =========================================================================
        const MAX_CAPACITY = 1100;

        const vesselsData = [
            // TIER 0: 4 Upstream Extractors (X = -24) with vastly different magnitudes
            {
                id: "deep_well", label: "[deep_well]", x: -24, z: -13.5,
                pkts: 500, radius: 1.85, color: 0x0066ff, role: "Primary Brine Extractor"
            },
            {
                id: "mycelium_vat", label: "[mycelium_vat]", x: -24, z: -4.5,
                pkts: 250, radius: 1.55, color: 0x00d68f, role: "Bio-Spore Cultivator"
            },
            {
                id: "solar_collector", label: "[solar_collector]", x: -24, z: 4.5,
                pkts: 170, radius: 1.40, color: 0xff9900, role: "Solar Ichor Condenser"
            },
            {
                id: "cinder_tap", label: "[cinder_tap]", x: -24, z: 13.5,
                pkts: 80, radius: 1.20, color: 0xff2a2a, role: "Trace Cinder Capillary"
            },

            // TIER 1: Central Wide-Bore Homogenizer (X = 0, Z = 0)
            // Receives 500 + 250 + 170 + 80 = 1000 packets stacked as immiscible layers!
            {
                id: "homogenizer", label: "[homogenizer]", x: 0, z: 0,
                pkts: 1000, radius: 3.35, color: 0xd4af37, role: "Stratified Manifold Vessel",
                layers: [
                    { name: "(brine)",   pkts: 500, color: 0x0066ff },
                    { name: "(spores)",  pkts: 250, color: 0x00d68f },
                    { name: "(ichor)",   pkts: 170, color: 0xff9900 },
                    { name: "(ash_oil)", pkts: 80,  color: 0xff2a2a }
                ]
            },

            // TIER 2: Downstream Refined Outputs (X = +24) + Side Filter Exit (Z = -14)
            {
                id: "slag_sump", label: "[slag_sump]", x: 0, z: -15.5,
                pkts: 100, radius: 1.35, color: 0x5a626a, role: "Precipitate Waste Filter", isFilter: true
            },
            {
                id: "aether_condenser", label: "[aether_condenser]", x: 24, z: -6.0,
                pkts: 650, radius: 2.15, color: 0x9d00ff, role: "High-Volume Aether Output"
            },
            {
                id: "elixir_retort", label: "[elixir_retort]", x: 24, z: 6.5,
                pkts: 250, radius: 1.55, color: 0xe619a1, role: "Distilled Elixir Output"
            }
        ];

        // Flows encode comparative magnitude via flow value (pkts)
        // layerIndex links each upstream pipe to the exact vertical band inside [homogenizer]
        const flowsData = [
            // 4-to-1 Convergence into [homogenizer]
            { from: "deep_well",       to: "homogenizer", label: "(brine: 500)",   pkts: 500, color: 0x0066ff, targetLayerIdx: 0 },
            { from: "mycelium_vat",    to: "homogenizer", label: "(spores: 250)",  pkts: 250, color: 0x00d68f, targetLayerIdx: 1 },
            { from: "solar_collector", to: "homogenizer", label: "(ichor: 170)",   pkts: 170, color: 0xff9900, targetLayerIdx: 2 },
            { from: "cinder_tap",      to: "homogenizer", label: "(ash_oil: 80)",  pkts: 80,  color: 0xff2a2a, targetLayerIdx: 3 },

            // 1-to-3 Divergence out of [homogenizer]
            { from: "homogenizer", to: "slag_sump",        label: "(dross: 100)",       pkts: 100, color: 0x6c757d, isWaste: true },
            { from: "homogenizer", to: "aether_condenser", label: "(royal_aether: 650)", pkts: 650, color: 0x9d00ff },
            { from: "homogenizer", to: "elixir_retort",    label: "(pure_elixir: 250)", pkts: 250, color: 0xe619a1 }
        ];

        // Square-root scaling helper: Cross-sectional area A = pi * r^2 is strictly proportional to pkts!
        function getPipeRadius(pkts) {
            return 0.0175 * Math.sqrt(pkts); // 500 -> 0.39, 250 -> 0.27, 80 -> 0.15, 650 -> 0.44
        }

        // =========================================================================
        // 2. THREE.JS SCENE, CAMERA & STEAMPUNK LIGHTING
        // =========================================================================
        const container = document.getElementById('canvas-container');
        const labelsLayer = document.getElementById('labels-layer');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0908);
        scene.fog = new THREE.FogExp2(0x0b0908, 0.008);

        const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 500);
        camera.position.set(0, 30, 48);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.06;
        controls.target.set(0, 3, 0);
        controls.maxPolarAngle = Math.PI / 2 - 0.03;
        controls.minDistance = 12;
        controls.maxDistance = 110;

        // Lighting
        scene.add(new THREE.AmbientLight(0x4a3b2c, 1.5));

        const dirLight = new THREE.DirectionalLight(0xffdfba, 1.3);
        dirLight.position.set(15, 45, 25);
        scene.add(dirLight);

        const leftLight = new THREE.PointLight(0x00aaff, 1.6, 50);
        leftLight.position.set(-24, 10, 0);
        scene.add(leftLight);

        const centerLight = new THREE.PointLight(0xffaa33, 1.8, 50);
        centerLight.position.set(0, 12, 5);
        scene.add(centerLight);

        const rightLight = new THREE.PointLight(0xb81dff, 1.6, 50);
        rightLight.position.set(24, 10, 0);
        scene.add(rightLight);

        // Floor & Brass Grid
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(110, 80),
            new THREE.MeshStandardMaterial({ color: 0x14100d, roughness: 0.85, metalness: 0.2 })
        );
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        const grid = new THREE.GridHelper(90, 45, 0x5c4020, 0x261c14);
        grid.position.y = 0.02;
        scene.add(grid);

        // Steampunk Materials
        const brassMat = new THREE.MeshStandardMaterial({ color: 0xc88a32, metalness: 0.85, roughness: 0.28 });
        const darkIronMat = new THREE.MeshStandardMaterial({ color: 0x2b2623, metalness: 0.7, roughness: 0.5 });
        const glassVesselMat = new THREE.MeshPhysicalMaterial({
            color: 0xffffff, transparent: true, opacity: 0.22,
            roughness: 0.08, metalness: 0.05, side: THREE.DoubleSide, depthWrite: false
        });

        function createGlowTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const g = ctx.createRadialGradient(32, 32, 2, 32, 32, 28);
            g.addColorStop(0, 'rgba(255,255,255,0.98)');
            g.addColorStop(0.4, 'rgba(255,255,255,0.5)');
            g.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }
        const particleTex = createGlowTexture();

        // =========================================================================
        // 3. BUILD STEAMPUNK VESSELS (WITH STRATIFIED BANDS IN HOMOGENIZER)
        // =========================================================================
        const vesselMap = {};
        const interactableMeshes = [];
        const animatedLiquids = [];

        const GLASS_HEIGHT = 6.2;
        const BASE_HEIGHT = 0.5;
        const MAX_LIQUID_H = GLASS_HEIGHT * 0.90;

        vesselsData.forEach((v, idx) => {
            const group = new THREE.Group();
            group.position.set(v.x, 0, v.z);
            const R = v.radius;

            // 1. Cast-Iron Ground Plinth & Brass Ring
            const plinth = new THREE.Mesh(
                new THREE.CylinderGeometry(R * 1.15, R * 1.25, BASE_HEIGHT, 28),
                darkIronMat
            );
            plinth.position.y = BASE_HEIGHT / 2;
            group.add(plinth);

            const ringGeo = new THREE.TorusGeometry(R * 1.06, 0.14, 12, 36);
            const botRing = new THREE.Mesh(ringGeo, brassMat);
            botRing.rotation.x = Math.PI / 2;
            botRing.position.y = BASE_HEIGHT;
            group.add(botRing);

            // 2. Glass Cylinder Wall
            const glassMesh = new THREE.Mesh(
                new THREE.CylinderGeometry(R, R, GLASS_HEIGHT, 36, 1, true),
                glassVesselMat
            );
            glassMesh.position.y = BASE_HEIGHT + GLASS_HEIGHT / 2;
            group.add(glassMesh);

            // 3. Steampunk Exterior Brass Tie-Rods (6 struts for wide homogenizer, 4 for standard)
            const numRods = R > 2.5 ? 6 : 4;
            const rodGeo = new THREE.CylinderGeometry(0.07, 0.07, GLASS_HEIGHT + 0.3, 8);
            for (let i = 0; i < numRods; i++) {
                const angle = (i * Math.PI * 2) / numRods + Math.PI / numRods;
                const rod = new THREE.Mesh(rodGeo, brassMat);
                rod.position.set(
                    Math.cos(angle) * (R * 1.06),
                    BASE_HEIGHT + GLASS_HEIGHT / 2,
                    Math.sin(angle) * (R * 1.06)
                );
                group.add(rod);
            }

            // 4. Top Brass Collar, Glass Dome & Pressure Valve
            const topY = BASE_HEIGHT + GLASS_HEIGHT;
            const topRing = new THREE.Mesh(ringGeo, brassMat);
            topRing.rotation.x = Math.PI / 2;
            topRing.position.y = topY;
            group.add(topRing);

            const dome = new THREE.Mesh(
                new THREE.SphereGeometry(R * 1.01, 28, 14, 0, Math.PI * 2, 0, Math.PI / 2.2),
                glassVesselMat
            );
            dome.position.y = topY;
            group.add(dome);

            const valve = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.45, 0.65, 14), brassMat);
            valve.position.y = topY + R * 0.92;
            group.add(valve);

            // 5. Liquid Fill: Stratified Immiscible Layers vs. Single Column
            const layerElevations = []; // Store mid-height Y of each layer for pipe port alignment!

            if (v.layers) {
                let currentBottomY = BASE_HEIGHT + 0.05;

                v.layers.forEach((layer, lIdx) => {
                    const layerH = (layer.pkts / MAX_CAPACITY) * MAX_LIQUID_H;
                    const lGeo = new THREE.CylinderGeometry(R * 0.93, R * 0.93, layerH, 32);
                    const lMat = new THREE.MeshStandardMaterial({
                        color: layer.color,
                        emissive: layer.color,
                        emissiveIntensity: 0.65,
                        roughness: 0.18,
                        metalness: 0.1,
                        transparent: true,
                        opacity: 0.90
                    });
                    const lMesh = new THREE.Mesh(lGeo, lMat);
                    const midY = currentBottomY + layerH / 2;
                    lMesh.position.y = midY;
                    group.add(lMesh);

                    // Crisp glowing meniscus divider line between immiscible layers
                    const divRing = new THREE.Mesh(
                        new THREE.RingGeometry(R * 0.80, R * 0.935, 36),
                        new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.65 })
                    );
                    divRing.rotation.x = -Math.PI / 2;
                    divRing.position.y = layerH / 2 + 0.01;
                    lMesh.add(divRing);

                    // Exterior Brass Gauge Ring on Homogenizer at each layer boundary
                    const gaugeRing = new THREE.Mesh(
                        new THREE.TorusGeometry(R * 1.02, 0.045, 8, 36),
                        brassMat
                    );
                    gaugeRing.rotation.x = Math.PI / 2;
                    gaugeRing.position.y = currentBottomY + layerH;
                    group.add(gaugeRing);

                    lMesh.userData = v;
                    interactableMeshes.push(lMesh);

                    layerElevations.push(midY);
                    currentBottomY += layerH;
                });

                animatedLiquids.push({ group: group, isStratified: true, phase: idx });

            } else {
                // Standard Single-Matter Liquid Column
                const fillRatio = v.pkts / MAX_CAPACITY;
                const liqH = Math.max(0.25, MAX_LIQUID_H * fillRatio);
                const liqGeo = new THREE.CylinderGeometry(R * 0.92, R * 0.92, liqH, 28);
                const liqMat = new THREE.MeshStandardMaterial({
                    color: v.color,
                    emissive: v.color,
                    emissiveIntensity: v.isFilter ? 0.25 : 0.65,
                    roughness: 0.2,
                    metalness: 0.1,
                    transparent: true,
                    opacity: v.isFilter ? 0.78 : 0.88
                });
                const liquidMesh = new THREE.Mesh(liqGeo, liqMat);
                liquidMesh.position.y = BASE_HEIGHT + liqH / 2 + 0.05;
                group.add(liquidMesh);

                const meniscus = new THREE.Mesh(
                    new THREE.RingGeometry(R * 0.75, R * 0.92, 32),
                    new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.45 })
                );
                meniscus.rotation.x = -Math.PI / 2;
                meniscus.position.y = liqH / 2 + 0.01;
                liquidMesh.add(meniscus);

                liquidMesh.userData = v;
                interactableMeshes.push(liquidMesh);
                animatedLiquids.push({ mesh: liquidMesh, isStratified: false, phase: idx * 0.9 });
            }

            glassMesh.userData = v;
            interactableMeshes.push(glassMesh);
            scene.add(group);

            // DOM Label
            const labelEl = document.createElement('div');
            labelEl.className = 'vessel-label';
            if (v.layers) {
                labelEl.style.borderColor = '#f3c677';
                labelEl.style.background = 'rgba(38, 26, 14, 0.95)';
            }
            labelEl.innerHTML = `${v.label}<span class="pkt-count">${v.pkts}</span>`;
            labelsLayer.appendChild(labelEl);

            vesselMap[v.id] = {
                data: v,
                group: group,
                labelEl: labelEl,
                labelY: topY + R + 0.85,
                layerElevations: layerElevations
            };
        });

        // =========================================================================
        // 4. AREA-PROPORTIONAL PIPES (r = k * sqrt(flow)) & MANIFOLD PORTS
        // =========================================================================
        const pipeParticles = [];
        const flowLabelList = [];

        flowsData.forEach((f) => {
            const srcNode = vesselMap[f.from];
            const tgtNode = vesselMap[f.to];
            const src = srcNode.data;
            const tgt = tgtNode.data;

            // Calculate proportional pipe radius using square-root law
            const pipeRadius = getPipeRadius(f.pkts);
            const innerRadius = pipeRadius * 0.58;

            // Determine start & end elevations
            const startY = f.from === "homogenizer"
                ? (f.isWaste ? 1.2 : 3.6) // Waste drains from bottom; refined aether draws from upper manifold
                : 1.8;

            // If flowing into the Stratified Homogenizer, plug directly into that layer's elevation!
            const endY = (f.targetLayerIdx !== undefined && tgtNode.layerElevations.length > 0)
                ? tgtNode.layerElevations[f.targetLayerIdx]
                : 1.8;

            const dir = new THREE.Vector3(tgt.x - src.x, 0, tgt.z - src.z).normalize();

            const startPt = new THREE.Vector3(
                src.x + dir.x * src.radius,
                startY,
                src.z + dir.z * src.radius
            );

            const endPt = new THREE.Vector3(
                tgt.x - dir.x * tgt.radius,
                endY,
                tgt.z - dir.z * tgt.radius
            );

            // Smooth S-bend control points
            const dx = (endPt.x - startPt.x) * 0.45;
            const dz = (endPt.z - startPt.z) * 0.45;
            const p1 = new THREE.Vector3(startPt.x + dx, startPt.y + 0.2, startPt.z + dz * 0.2);
            const p2 = new THREE.Vector3(endPt.x - dx, endPt.y + 0.2, endPt.z - dz * 0.2);

            const curve = new THREE.CubicBezierCurve3(startPt, p1, p2, endPt);

            // Scaled Brass Flange Collars at Vessel Ports
            const flangeGeo = new THREE.CylinderGeometry(pipeRadius * 1.45, pipeRadius * 1.45, 0.28, 16);
            flangeGeo.rotateZ(Math.PI / 2);

            const sFlange = new THREE.Mesh(flangeGeo, brassMat);
            sFlange.position.copy(startPt);
            sFlange.lookAt(p1);
            sFlange.rotateY(Math.PI / 2);
            scene.add(sFlange);

            const eFlange = new THREE.Mesh(flangeGeo, brassMat);
            eFlange.position.copy(endPt);
            eFlange.lookAt(p2);
            eFlange.rotateY(Math.PI / 2);
            scene.add(eFlange);

            // 1. Outer Glass Pipe (Scaled by sqrt(flow))
            const outerTube = new THREE.Mesh(
                new THREE.TubeGeometry(curve, 36, pipeRadius, 16, false),
                glassVesselMat
            );
            scene.add(outerTube);

            // 2. Inner Liquid Stream Core
            const innerTube = new THREE.Mesh(
                new THREE.TubeGeometry(curve, 36, innerRadius, 12, false),
                new THREE.MeshBasicMaterial({
                    color: f.color,
                    transparent: true,
                    opacity: f.isWaste ? 0.38 : 0.62
                })
            );
            scene.add(innerTube);

            // Midpoint Brass Support Collar & Ground Strut
            const midPt = curve.getPointAt(0.5);
            const brace = new THREE.Mesh(
                new THREE.TorusGeometry(pipeRadius * 1.15, 0.055, 10, 20),
                brassMat
            );
            brace.position.copy(midPt);
            brace.lookAt(endPt);
            scene.add(brace);

            const strut = new THREE.Mesh(
                new THREE.CylinderGeometry(0.05, 0.08, midPt.y, 8),
                darkIronMat
            );
            strut.position.set(midPt.x, midPt.y / 2, midPt.z);
            scene.add(strut);

            // 3. Animated Flow Pulses (Packet count & scale proportional to pipe bore)
            const numPulses = Math.max(3, Math.min(8, Math.floor(Math.sqrt(f.pkts) / 3.2)));
            const speed = 0.0022 + (f.pkts / 1000) * 0.0022;
            const spriteScale = pipeRadius * 3.4;

            for (let i = 0; i < numPulses; i++) {
                const spMat = new THREE.SpriteMaterial({
                    map: particleTex,
                    color: f.color,
                    transparent: true,
                    opacity: 0.85,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });
                const sp = new THREE.Sprite(spMat);
                sp.scale.set(spriteScale, spriteScale, 1);
                scene.add(sp);

                pipeParticles.push({
                    sprite: sp,
                    curve: curve,
                    t: i / numPulses,
                    speed: speed
                });
            }

            // 4. Flow Label showing matter type and discrete flow rate
            const flEl = document.createElement('div');
            flEl.className = 'flow-label';
            flEl.style.borderColor = '#' + f.color.toString(16).padStart(6, '0');
            flEl.textContent = f.label;
            labelsLayer.appendChild(flEl);

            flowLabelList.push({
                el: flEl,
                pos: new THREE.Vector3(midPt.x, midPt.y + pipeRadius + 0.55, midPt.z)
            });
        });

        // =========================================================================
        // 5. HOVER TELEMETRY (WITH STRATIFIED LAYER BREAKDOWN)
        // =========================================================================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const tooltip = document.getElementById('tooltip');
        const ttName = document.getElementById('tt-name');
        const ttRole = document.getElementById('tt-role');
        const ttPkts = document.getElementById('tt-pkts');
        const ttBore = document.getElementById('tt-bore');
        const ttLayers = document.getElementById('tt-layers');

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const hits = raycaster.intersectObjects(interactableMeshes);

            if (hits.length > 0) {
                const d = hits[0].object.userData;
                document.body.style.cursor = 'pointer';
                tooltip.style.display = 'block';
                tooltip.style.left = `${e.clientX}px`;
                tooltip.style.top = `${e.clientY}px`;

                ttName.textContent = d.label;
                ttName.style.color = '#' + d.color.toString(16).padStart(6, '0');
                ttRole.textContent = d.role;
                ttPkts.textContent = `${d.pkts} pkts`;
                ttBore.textContent = `R = ${d.radius.toFixed(2)}m`;

                if (d.layers) {
                    let html = `<div style="margin-top:6px; border-top:1px solid rgba(212,175,55,0.3); padding-top:4px; font-size:0.75rem; color:#f3c677;">STRATIFIED COMPOSITION:</div>`;
                    d.layers.slice().reverse().forEach(l => {
                        const hex = '#' + l.color.toString(16).padStart(6, '0');
                        html += `<div class="layer-bar"><span class="layer-swatch" style="background:${hex}"></span>${l.name}: <strong style="margin-left:auto; color:#fff;">${l.pkts}</strong></div>`;
                    });
                    ttLayers.innerHTML = html;
                } else {
                    ttLayers.innerHTML = '';
                }
            } else {
                document.body.style.cursor = 'default';
                tooltip.style.display = 'none';
            }
        });

        // =========================================================================
        // 6. ANIMATION & PROJECTION LOOP
        // =========================================================================
        const clock = new THREE.Clock();

        function projectToScreen(vec3, domEl) {
            const p = vec3.clone().project(camera);
            if (p.z > 1) {
                domEl.style.display = 'none';
            } else {
                domEl.style.display = 'block';
                const x = (p.x * 0.5 + 0.5) * window.innerWidth;
                const y = (-(p.y * 0.5) + 0.5) * window.innerHeight;
                domEl.style.left = `${x}px`;
                domEl.style.top = `${y}px`;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();

            controls.update();

            // Subtle breathing on single-column liquids
            animatedLiquids.forEach(item => {
                if (!item.isStratified && item.mesh) {
                    const wave = Math.sin(elapsed * 2.2 + item.phase) * 0.014;
                    item.mesh.scale.set(1, 1 + wave, 1);
                }
            });

            // Downstream pulses in proportional glass pipes
            pipeParticles.forEach(p => {
                p.t += p.speed;
                if (p.t > 1) p.t -= 1;
                p.sprite.position.copy(p.curve.getPointAt(p.t));
            });

            // Update 3D Labels
            Object.values(vesselMap).forEach(v => {
                projectToScreen(new THREE.Vector3(v.data.x, v.labelY, v.data.z), v.labelEl);
            });

            flowLabelList.forEach(fl => {
                projectToScreen(fl.pos, fl.el);
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
