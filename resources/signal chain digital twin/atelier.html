<style>
/* Layout: a workshop bench. Nameplate bar, a control strip, a machine rail on the left (gallery only), the 3D stage filling the rest. */
:root {
    --abyss: #07080b;
    --glass: rgba(14, 16, 20, 0.82);
    --steel: #2b2f36;
    --text: #c9ccd2;
    --dim: #7d838d;
    --bright: #f1f2f4;
    --brass: #c8a46a;
    --font-display: "Saira Condensed", "Arial Narrow", system-ui, sans-serif;
    --font-body: Inter, system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
    color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--abyss); color: var(--text); font: 400 13px/1.45 var(--font-body); overflow: hidden; }
.app { height: 100%; display: flex; flex-direction: column; }
.bar, .controls {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.bar { padding-block: 10px; border-bottom: 1px solid var(--steel); background: linear-gradient(#0d0f13, #0a0b0e); }
.controls { padding-block: 8px; border-bottom: 1px solid var(--steel); background: #0a0b0e; }
.brand { font: 600 15px var(--font-display); letter-spacing: 0.22em; text-transform: uppercase; color: var(--bright); display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand small { font: 500 11px var(--font-mono); letter-spacing: 0.04em; text-transform: none; color: var(--dim); }
.spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--steel); border-radius: 7px; overflow: hidden; }
.seg button, .btn {
    font: 600 11px var(--font-display); letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--dim); background: transparent; border: 0; padding: 6px 11px; cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--steel); }
.seg button[aria-pressed="true"] { color: #15110a; background: var(--brass); }
.btn { border: 1px solid var(--brass); color: var(--brass); border-radius: 7px; }
.btn:hover { background: rgba(200, 164, 106, 0.12); }
.seg button:focus-visible, .btn:focus-visible, select:focus-visible { outline: 2px solid var(--brass); outline-offset: -2px; }
select { font: 500 11px var(--font-mono); color: var(--text); background: #111318; border: 1px solid var(--steel); border-radius: 7px; padding: 5px 8px; max-width: 100%; }
.seg-label { font: 500 10px var(--font-mono); color: var(--dim); text-transform: uppercase; letter-spacing: 0.1em; }
.group { display: inline-flex; align-items: center; gap: 7px; }
main { flex: 1; display: flex; min-height: 0; }
.rail {
    width: 220px; flex: none; overflow-y: auto; border-right: 1px solid var(--steel);
    padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; background: #0a0b0e;
}
.rail h2 { font: 600 10px var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); margin: 10px 8px 4px; }
.rail button {
    display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; cursor: pointer;
    background: transparent; border: 0; border-radius: 6px; padding: 6px 8px; color: var(--text); font: 500 12px var(--font-body);
}
.rail button i { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--c); box-shadow: 0 0 8px var(--c); }
.rail button small { margin-left: auto; color: var(--dim); font: 400 10px var(--font-mono); }
.rail button:hover { background: rgba(255, 255, 255, 0.04); }
.rail button[aria-current="true"] { background: rgba(200, 164, 106, 0.14); color: var(--bright); }
.rail button:focus-visible { outline: 2px solid var(--brass); }
.stage { flex: 1; position: relative; min-width: 0; }
canvas { display: block; width: 100%; height: 100%; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 6; }
.lbl {
    position: absolute; left: 0; top: 0; white-space: nowrap; text-align: center;
    font: 600 10px var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--bright);
    padding: 1px 6px; border-radius: 3px; background: rgba(5, 6, 8, 0.62);
}
.lbl b { display: block; font: 500 9px var(--font-mono); letter-spacing: 0.02em; text-transform: none; color: var(--c, var(--dim)); }
.lbl .acts { display: flex; gap: 3px; justify-content: center; margin: 3px 0 1px; }
.lbl .acts button {
    pointer-events: auto; cursor: pointer; font: 600 9px var(--font-display); letter-spacing: 0.12em; text-transform: uppercase;
    color: #15110a; background: var(--brass); border: 0; border-radius: 3px; padding: 2px 6px;
}
.lbl .acts button.danger { background: #c9584f; color: #fff; }
.lbl .acts button:hover { filter: brightness(1.15); }
.lbl .acts button:focus-visible { outline: 2px solid var(--bright); }
.caption, .legend {
    position: absolute; bottom: 16px; padding: 11px 13px; border-radius: 8px;
    background: var(--glass); box-shadow: inset 0 0 0 1px var(--steel); z-index: 7;
}
.caption { left: 16px; max-width: min(430px, calc(100% - 32px)); }
.caption h3 { margin: 0; font: 600 18px var(--font-display); letter-spacing: 0.2em; text-transform: uppercase; color: var(--bright); text-wrap: balance; }
.caption .holds { font: 500 11px var(--font-mono); color: var(--c, var(--brass)); margin: 2px 0 8px; }
.caption p { margin: 0; }
.legend { right: 16px; max-width: 310px; font: 400 11px var(--font-mono); color: var(--dim); }
.legend b { color: var(--text); font-weight: 500; }
.legend ul { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.legend li { display: flex; align-items: center; gap: 5px; }
.legend li i { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
.toast {
    position: absolute; left: 50%; top: 16px; transform: translateX(-50%); z-index: 8;
    padding: 7px 14px; border-radius: 7px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--brass);
    font: 500 12px var(--font-mono); color: var(--bright); transition: opacity .3s; pointer-events: none;
}
@media (max-width: 760px) {
    main { flex-direction: column; }
    .rail { width: auto; height: 110px; border-right: 0; border-bottom: 1px solid var(--steel); flex-direction: row; flex-wrap: wrap; align-content: flex-start; }
    .rail h2 { display: none; }
    .rail button { width: auto; }
    .legend { display: none; }
}
</style>

            <div class="caption" id="caption"></div>
            <div class="legend" id="legend"></div>
        </section>
    </main>
</div>

<script type="module">

/* ------------------------------------------------------------------ */

// Each zone has its own vessel scale: a full Net heart holds 10x the rows of a full Core

const NODES = [

    { id: 'arena', name: 'Arena', kind: 'arena', zone: 'core', matter: 'animus', light: '#ffb0b6', color: '#ef3e4a', pos: [180, 0], vessel: true },

// where the harvester pipes merge into one trunk to the Centrifuge

const NODE = Object.fromEntries([...NODES, MANIFOLD].map((n) => [n.id, n]));
const CHAIN = ['hopper', 'refinery', 'alembic', 'crucible', 'arena', 'treasury', 'archive'];
const PIPES = [
    ...['luma', '19hz', 'ra', 'eventbrite'].map((h) => [`harvester:${h}`, 'manifold']),
    ['manifold', 'centrifuge'],
    ['centrifuge', 'sump'], ['centrifuge', 'hopper'], ['forge', 'hopper'],
    ...CHAIN.slice(1).map((b, i) => [CHAIN[i], b]),

    ['codex', 'refinery', 'plates'],
    ['entropy_market', 'crucible', 'market'], ['entropy_market', 'arena', 'market'], ['entropy_market', 'treasury', 'market'],
];
const FLOWS = [
    ['alembic', 'crucible', 6], ['arena', 'treasury', 4], ['centrifuge', 'harvester:luma', 26], ['centrifuge', 'hopper', 1],
    ['centrifuge', 'sump', 25], ['codex', 'refinery', 13], ['crucible', 'arena', 3], ['forge', 'hopper', 13],
    ['harvester:luma', 'centrifuge', 52], ['hopper', 'refinery', 10], ['refinery', 'alembic', 6], ['treasury', 'arena', 2],
    // demo only (not in the log): a kill along the chain, a revive through the Centrifuge, market traffic
    ['hopper', 'necropolis', 2], ['sump', 'hopper', 2], ['entropy_market', 'arena', 2], ['entropy_market', 'treasury', 2],
];
// plinth radius of each machine (the plinth carries ports, filter band, keystone, levers)
const FOOT = { junction: 0, harvester: 8, centrifuge: 10, sump: 13, forge: 11, hopper: 9, refinery: 7, alembic: 9, crucible: 10, arena: 12, treasury: 9, archive: 10, necropolis: 10, codex: 8, market: 9, nexus: 8, atlas: 7, calendar: 8 };
const PLINTH_H = 3.4;
const NOTES = {
    harvester: 'Its heart is the glass flux tank; brass bands and struts hold it, and a gilt intake rotor crowns it. Locked harvesters stand dark and chained.',
    centrifuge: 'A glass drum at the heart, its surface swirling, inside a gilt rotor cage that whirls around it.',
    sump: 'A squat glass well sunk into its plinth, a grate across the top and a dredge wheel on an iron gantry that turns through the dross while its panel is in use.',
    forge: 'A brick hearth with bellows, and an anvil under a trip hammer. While its panel is in use the hammer strikes, the bellows pump and sparks burst. A dynamo: it holds nothing.',
    hopper: 'A glass cylinder fed from above by a ribbed brass funnel throat, held up by iron legs.',
    refinery: 'A glass fractionating column. Gilt trays inside light up once the essence reaches them. In use, a flywheel and piston drive it and the essence bubbles.',
    alembic: 'A glass pot in copper straps under a copper still-head. Its swan neck falls into an open copper condenser coil that drips into a copper cup.',
    crucible: 'A glass crucible in a clawed iron cradle, wound with a copper induction coil. In use, a geared stirrer turns in the melt.',
    arena: 'A glass drum of animus inside a ring of standing stones, runes on their inner faces.',
    treasury: 'A glass reliquary drum in a gilt chest-cage: corner finials and arched straps over the top.',
    archive: 'A glass vitrine inside an iron shelving frame stacked with brass-bound crates.',
    necropolis: 'A glass urn under a columned mausoleum roof.',
    codex: 'A glass-fronted cabinet of specimen jars, one per object. Objects aren\'t adventures, so its pipe to the Refinery is a gilt plate conveyor.',
    market: 'A hexagonal kiosk, chained and dark until it is built. It will move costs and rewards, so its pipes are gold-banded.',
    nexus: 'The lantern: a gilt cage around a glowing prism, with lens rings turning on gimbals.',
    atlas: 'A terrestrial globe: gilt continents on a dark sea, an engraved graticule and a rune band at the equator, held in a meridian ring over a horizon ring of runes. In use, it spins on its tilted axis.',

/* ------------------------------------------------------------------ */
/*  Lens, filter, stage filter (plinth band), selection                 */
/* ------------------------------------------------------------------ */
const PALETTE = ['#4fb3ff', '#3ccf8e', '#f2b134', '#f0643c', '#c86bf0', '#2fd2c9', '#ff7aa8', '#a3d14b', '#8f8cff', '#ffb27a'];
const FIXED = { source: { luma: '#3ccf8e', '19hz': '#4f8cff', ra: '#f2b134', eventbrite: '#f0643c' }, type: { event: '#4fb3ff', item: '#e0a43a', song: '#c86bf0' } };
const hash = (s) => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); };
const state = { view: 'twin', lens: 'stage', filter: 'none', stage: {}, selected: '', inUse: '', galId: 'refinery' };
/** 1 normally; faster and brighter while the machine's panel is in use */
const busy = (n) => (state.inUse && (n.use ?? n.panel) === state.inUse ? 3 : 0);
const accent = (n) => n.color ?? n.light;
function lensValue(row, n) {
    if (state.lens === 'stage') return n.matter;
    if (state.lens === 'type' && n.zone === 'net') return 'raw event';
    return row[state.lens] ?? 'unknown';
}
function lensColor(value, n) {
    if (state.lens === 'stage') return n.light;
    if (value === 'unknown') return '#5b616b';
    if (value === 'raw event') return '#3c4048';
    return FIXED[state.lens]?.[value] ?? PALETTE[hash(value) % PALETTE.length];
}
function passes(row, n) {
    if (state.stage[n.id] === 'exclude') return false;
    const zoneIncl = Object.entries(state.stage).filter(([id, m]) => m === 'include' && NODE[id].zone === n.zone);
    if (zoneIncl.length && state.stage[n.id] !== 'include') return false;
    if (state.filter === 'la') return row.city === 'Los Angeles';
    if (state.filter === 'noitems') return n.zone === 'net' || row.type !== 'item';
    return true;
}
function bandsOf(n) {
    const rows = ROWS[n.id] ?? [];
    const lit = new Map(); let ghost = 0;
    for (const r of rows) { if (!passes(r, n)) { ghost++; continue; } const v = lensValue(r, n); lit.set(v, (lit.get(v) ?? 0) + 1); }
    const bands = [...lit].sort((a, b) => b[1] - a[1]).map(([value, count]) => ({ value, count, color: lensColor(value, n) }));
    return { bands, ghost, total: rows.length, lit: rows.length - ghost };
}

/* ------------------------------------------------------------------ */

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
const envMap = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

/* ------------------------------------------------------------------ */
/*  Canvas textures                                                     */
/* ------------------------------------------------------------------ */
const RUNES = [
    [[0, -1, 0, 1], [-0.6, -0.3, 0.6, -0.3]], [[-0.6, 1, 0, -1], [0, -1, 0.6, 1]],
    [[-0.5, -1, -0.5, 1], [-0.5, 0, 0.5, -1], [-0.5, 0, 0.5, 1]], [[0, -1, 0, 1], [0, -0.2, 0.6, -0.8], [0, -0.2, -0.6, -0.8]],
    [[-0.6, -1, 0.6, -1], [0.6, -1, -0.6, 1], [-0.6, 1, 0.6, 1]], [[-0.5, -1, -0.5, 1], [-0.5, -1, 0.5, -0.4], [0.5, -0.4, -0.5, 0.2]],
    [[0, -1, 0, 1], [-0.6, 0.4, 0.6, 0.4], [-0.6, -0.4, 0.6, -0.4]], [[-0.6, -1, 0.6, 1], [0.6, -1, -0.6, 1]],

    return { x0: Math.min(...ps.map((p) => p[0])) - pad, x1: Math.max(...ps.map((p) => p[0])) + pad, z0: Math.min(...ps.map((p) => p[1])) - pad, z1: Math.max(...ps.map((p) => p[1])) + pad };
}
const wallFrag = `uniform vec3 uColor; varying vec2 vUv; void main(){ float y = vUv.y; float a = 0.04 + pow(1.0 - y, 2.0) * 0.2 + exp(-y * 18.0) * 0.35; a *= smoothstep(1.0, 0.55, y); gl_FragColor = vec4(uColor * a, a); }`;
function corner() {
    // two floor rails sweeping up into a short post, one silver-and-gilt piece
    const g = G(), L = 16;
    for (const axis of [0, 1]) {
        const pt = (d, y) => axis ? V(0, y, d) : V(d, y, 0);
        g.add(tube([pt(L, 0.6), pt(9, 0.6), pt(4, 0.9), pt(1.6, 2.8), pt(0.5, 6), pt(0.3, 9)], 0.42, M.silver, 40));
        g.add(ball(0.7, M.silver, axis ? 0 : L, 0.6, axis ? L : 0));
        const c = curl(1.6, 1.4, M.silver); c.position.copy(pt(7, 1.8)); c.rotation.y = axis ? -Math.PI / 2 : 0; g.add(c);
    }
    g.add(cyl(1.6, 2, 0.8, M.iron, 0, 16), cyl(0.5, 0.6, 12, M.silver, 0.8, 12), torus(0.75, 0.2, M.gilt, 6), torus(0.75, 0.2, M.gilt, 11));
    const f = finial(0.55, M.silver); f.position.y = 12.8; g.add(f);
    const gm = new THREE.Mesh(new THREE.OctahedronGeometry(0.9), glow(SILVER, 2)); gm.position.y = 18; g.add(gm);
    return g;
}
function buildZones(scene) {
    const color = new THREE.Color(SILVER);
    for (const z of ZONES) {
        const r = zoneRect(z), H = 26, w = r.x1 - r.x0, d = r.z1 - r.z0;
        const tex = texture(zoneFloor(z.id, r), false);
        const fl = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({ map: tex, color: color.clone().multiplyScalar(0.13), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
        fl.rotation.x = -Math.PI / 2; fl.position.set((r.x0 + r.x1) / 2, 0.04, (r.z0 + r.z1) / 2); scene.add(fl);
        const edges = [[r.x0, r.z0, r.x1, r.z0], [r.x1, r.z0, r.x1, r.z1], [r.x1, r.z1, r.x0, r.z1], [r.x0, r.z1, r.x0, r.z0]];
        for (const [ax, az, bx, bz] of edges) {
            const len = Math.hypot(bx - ax, bz - az), ry = -Math.atan2(bz - az, bx - ax);
            const wall = new THREE.Mesh(new THREE.PlaneGeometry(len, H), new THREE.ShaderMaterial({ uniforms: { uColor: { value: color } }, vertexShader: flowVert, fragmentShader: wallFrag, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, toneMapped: false }));
            wall.position.set((ax + bx) / 2, H / 2, (az + bz) / 2); wall.rotation.y = ry; scene.add(wall);
            const line = new THREE.Mesh(new THREE.BoxGeometry(len, 0.2, 0.5), new THREE.MeshBasicMaterial({ color: color.clone().multiplyScalar(1.2), toneMapped: false }));
            line.position.set((ax + bx) / 2, 0.1, (az + bz) / 2); line.rotation.y = ry; scene.add(line);
        }
        [[r.x0, r.z0, 0], [r.x1, r.z0, -Math.PI / 2], [r.x1, r.z1, Math.PI], [r.x0, r.z1, Math.PI / 2]].forEach(([x, cz, ry]) => { const c = corner(); c.position.set(x, 0, cz); c.rotation.y = ry; scene.add(c); });
        // the inlay plaque: flush with the floor, just inside the near edge
        const pl = new THREE.Mesh(new THREE.PlaneGeometry(64, 16), additive(plaqueTexture(z.id, z.name), SILVER, 0.55));
        pl.rotation.x = -Math.PI / 2; pl.position.set((r.x0 + r.x1) / 2, 0.06, r.z1 - 14); scene.add(pl);
    }
}

/* ------------------------------------------------------------------ */
/*  Scenes                                                             */
/* ------------------------------------------------------------------ */
function plainFloor(size) {
    const [c, g] = canvas2d(512);
    const grad = g.createRadialGradient(256, 256, 0, 256, 256, 256); grad.addColorStop(0, '#13151a'); grad.addColorStop(1, '#07080b');
    g.fillStyle = grad; g.fillRect(0, 0, 512, 512);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(size, size), std({ map: texture(c), roughness: 0.8, metalness: 0.25, envMapIntensity: 0.35 }));
    m.rotation.x = -Math.PI / 2; return m;
}
function baseScene() {
    const s = new THREE.Scene();
    s.background = new THREE.Color(0x07080b);
    s.environment = envMap; s.environmentIntensity = 0.75;
    s.add(new THREE.HemisphereLight(0x9fb4d0, 0x1a1208, 0.5));
    const key = new THREE.DirectionalLight(0xffe2b8, 1.6); key.position.set(150, 260, 120); s.add(key);
    const rim = new THREE.DirectionalLight(0x6fb8ff, 0.7); rim.position.set(-200, 120, -220); s.add(rim);
    return s;
}
function dispose(obj) { obj.traverse((o) => { if (o.geometry && o.geometry !== SPHERE) o.geometry.dispose(); }); }

const twin = { scene: baseScene(), anims: [], machineAnims: [], labels: [], machines: G() };
twin.scene.fog = new THREE.Fog(0x07080b, 900, 1600);
twin.scene.add(plainFloor(1600), twin.machines);
buildPipes(twin.scene);
const temperLabelAt = buildTemper(twin.scene, twin.anims);
{   // the manifold: a hub where the harvester pipes merge
    const hub = G(); hub.position.set(MANIFOLD.pos[0], 0, MANIFOLD.pos[1]);
    hub.add(cyl(3.6, 4, 1, M.stone, 0, 24), cyl(2.6, 2.6, 3.6, M.iron, 1, 24), torus(2.6, 0.3, M.brass, 4.6), torus(2.65, 0.12, glow(NODE['harvester:luma'].light, 1.2), 2.4));
    twin.scene.add(hub);
}
buildZones(twin.scene);
function buildMachines() {
    dispose(twin.machines); twin.machines.clear(); twin.machineAnims = []; twin.labels = [];

    for (const n of NODES) {
        if (n.virtual) continue;
        const { group, height } = makeMachine(n, twin.machineAnims, portsOf[n.id] ?? []);
        group.position.set(n.pos[0], 0, n.pos[1]); group.scale.setScalar(SCALE);
        group.traverse((o) => { o.userData.node = n.id; });
        twin.machines.add(group);
        twin.labels.push({ n, at: V(n.pos[0], height * SCALE + 6, n.pos[1]) });
    }
}
// selection: a magic circle on the floor in the row's matter colour; the old one closes, the new one opens
const selection = { cur: null, old: [] };
function selCircle(n) {
    const g = G(), r = (FOOT[n.kind] + 7) * SCALE;
    const o = new THREE.Mesh(new THREE.CircleGeometry(r, 64), additive(CIRCLE.outer, n.light, 0)), i = new THREE.Mesh(new THREE.CircleGeometry(r * 0.72, 64), additive(CIRCLE.inner, n.light, 0));
    for (const m of [o, i]) { m.rotation.x = -Math.PI / 2; m.position.y = 0.1; m.raycast = () => {}; g.add(m); }
    g.position.set(n.pos[0], 0, n.pos[1]); g.scale.setScalar(0.01); twin.scene.add(g);
    return { g, o, i, t: 0 };
}
function setSelection() {
    if (selection.cur) { selection.cur.t = 0; selection.old.push(selection.cur); }
    const id = state.selected.split(':')[0];
    selection.cur = id && NODE[id] ? selCircle(NODE[id]) : null;
}
const ease = (t) => 1 - Math.pow(1 - t, 3);
function stepSelection(dt) {
    const c = selection.cur;
    if (c) {
        c.t = Math.min(1, c.t + dt / 0.8); const k = ease(c.t);
        c.g.scale.setScalar(0.05 + 0.95 * k); c.o.material.opacity = 0.9 * k; c.i.material.opacity = 0.8 * k;
        c.o.rotation.z += dt * (0.2 + (1 - k) * 5); c.i.rotation.z -= dt * (0.35 + (1 - k) * 7);
    }
    selection.old = selection.old.filter((s) => {
        s.t += dt / 0.55; const k = 1 - ease(Math.min(1, s.t));
        s.g.scale.setScalar(Math.max(0.01, k)); s.o.material.opacity = 0.9 * k; s.i.material.opacity = 0.8 * k;
        s.o.rotation.z -= dt * 6; s.i.rotation.z += dt * 8;
        if (s.t >= 1) { twin.scene.remove(s.g); s.g.traverse((o) => o.geometry?.dispose()); return false; }
        return true;
    });
}
const center = V(-40, 0, -40);
const twinCam = new THREE.OrthographicCamera(-1, 1, 1, -1, -3000, 3000);
twinCam.position.copy(center).add(V(520, 560, 700));

const gallery = { scene: baseScene(), anims: [], turntable: G() };
gallery.scene.add(plainFloor(3000));
gallery.scene.fog = new THREE.Fog(0x07080b, 160, 560);
{
    const o = new THREE.Mesh(new THREE.CircleGeometry(40, 64), additive(CIRCLE.outer, SILVER, 0.16)); o.rotation.x = -Math.PI / 2; o.position.y = 0.05;
    gallery.scene.add(o, gallery.turntable);
    gallery.plinthAnim = (dt) => { o.rotation.z += dt * 0.05; };
}
const galCam = new THREE.PerspectiveCamera(32, 1, 1, 2000);

/* ------------------------------------------------------------------ */
/*  Rendering, controls, UI                                            */
/* ------------------------------------------------------------------ */
const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(twin.scene, twinCam);
composer.addPass(renderPass); composer.addPass(new UnrealBloomPass(new THREE.Vector2(256, 256), 0.5, 0.5, 0.85)); composer.addPass(new OutputPass());
const twinControls = new OrbitControls(twinCam, canvas);
twinControls.target.copy(center); twinControls.enableDamping = true; twinControls.maxPolarAngle = 1.35;
const galControls = new OrbitControls(galCam, canvas);
galControls.enableDamping = true; galControls.maxPolarAngle = 1.5; galControls.enabled = false;

const labelsEl = document.getElementById('labels'), caption = document.getElementById('caption'), legend = document.getElementById('legend'), rail = document.getElementById('rail'), toastEl = document.getElementById('toast');
let toastTimer;
function toast(msg) { toastEl.textContent = msg; toastEl.style.opacity = '1'; clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.style.opacity = '0'; }, 1800); }
for (const [zone, title] of [['net', 'Net'], ['core', 'Core'], ['gallery', 'Viewers']]) {
    const h = document.createElement('h2'); h.textContent = title; rail.appendChild(h);
    for (const n of NODES.filter((m) => m.zone === zone && (!m.locked || m.id === 'harvester:19hz' || m.id === 'entropy_market'))) {
        const b = document.createElement('button'); b.type = 'button'; b.dataset.id = n.id; b.style.setProperty('--c', n.light);
        b.innerHTML = `<i></i><span>${n.locked ? `${n.name} (locked)` : n.name}</span>${n.panel ? '<small>panel</small>' : ''}`;
        b.addEventListener('click', () => { state.galId = n.id; showMachine(); });
        rail.appendChild(b);
    }
}
function countLine(n) {
    if (!n.vessel) return n.locked ? 'locked' : n.sub ?? (n.objects ? `${n.objects} objects` : 'dynamo');
    const { total, lit } = bandsOf(n);
    return total === 0 || lit === total ? `${total} ${n.matter}` : `${lit} of ${total} ${n.matter} lit`;
}
function showMachine() {
    const n = NODE[state.galId];
    for (const b of rail.querySelectorAll('button')) b.setAttribute('aria-current', String(b.dataset.id === n.id));
    dispose(gallery.turntable); gallery.turntable.clear(); gallery.anims = [];
    const { group } = makeMachine(n, gallery.anims, [Math.PI, 0]);
    group.traverse((o) => { o.userData.node = n.id; });
    gallery.turntable.add(group);
    const box3 = new THREE.Box3().setFromObject(group), size = box3.getSize(V(0, 0, 0)), mid = box3.getCenter(V(0, 0, 0));
    const r = Math.max(size.x, size.y, size.z, 26);
    galControls.target.set(mid.x, mid.y, mid.z);
    galCam.position.set(mid.x + r * 1.4, mid.y + r * 0.7 + 6, mid.z + r * 1.8);
    galControls.update();
    caption.style.setProperty('--c', n.light);
    const vesselNote = n.vessel ? ` Its heart fills at ${CAP[n.zone]} rows (${n.zone === 'net' ? 'Net' : 'Core'} scale).` : '';
    const base = `${n.panel ? `The turning circle on its base marks a panel: click the machine to open ${n.panel}. ` : ''}${n.vessel && !n.locked ? 'Click its base to filter by its matter (the rim shows the filter). ' : ''}${n.actions ? `Its label holds ${n.actions.join(', ')}.` : ''}`;
    caption.innerHTML = `<h3>${n.name}</h3><div class="holds">${countLine(n)}${n.panel ? ` · opens the ${n.panel} panel` : ''}</div><p>${NOTES[n.kind]}${vesselNote} ${base}</p>`;
}
function renderLegend() {
    const seen = new Map();
    for (const n of NODES) for (const b of bandsOf(n).bands) if (!seen.has(b.value)) seen.set(b.value, b.color);
    const items = [...seen].slice(0, 14).map(([v, c]) => `<li><i style="--c:${c}"></i>${v}</li>`).join('');
    const filtered = NODES.some((n) => bandsOf(n).ghost);
    legend.innerHTML = `<b>Hearts</b> fill by row count: Net at ${CAP.net}, Core at ${CAP.core}; the Temper marks the step.<ul>${items}${filtered ? '<li><i style="--c:#2a2f38"></i>filtered out</li>' : ''}</ul><br><b>Click a machine</b> to open its panel (machines with a panel have a circle turning on their base). <b>Click its base</b> to filter by its matter: the rim turns white = only, red = not. Machines move only while their panel is in use. Net actions sit in the labels.<br><br><b>Pipes</b> stay dark until a move runs through. Replay, or click a pipe.`;
}
function makeLabels() {
    labelsEl.replaceChildren();
    if (state.view !== 'twin') return;
    for (const l of twin.labels) {
        const d = document.createElement('div'); d.className = 'lbl';
        d.style.setProperty('--c', (l.n.vessel || l.n.sub) && !l.n.locked ? l.n.light : 'var(--dim)');
        d.innerHTML = `${l.n.name}<b>${countLine(l.n)}</b>`;
        if (l.n.actions && !l.n.locked) {
            const acts = document.createElement('div'); acts.className = 'acts';
            for (const name of l.n.actions) {
                const b = document.createElement('button'); b.type = 'button'; b.textContent = name; if (name === 'Purge') b.className = 'danger';
                b.addEventListener('click', () => runAction(l.n, name)); acts.appendChild(b);
            }
            d.appendChild(acts);
        }
        labelsEl.appendChild(d); l.el = d;
    }
    const s = document.createElement('div'); s.className = 'lbl'; s.innerHTML = `Temper<b>${CAP.net} : ${CAP.core} scale</b>`; labelsEl.appendChild(s);
    twin.temperLabel = { el: s, at: temperLabelAt };
}
function rebuild() { buildMachines(); if (state.view === 'gallery') showMachine(); makeLabels(); renderLegend(); }
function syncButtons() {
    for (const b of document.querySelectorAll('[data-lens]')) b.setAttribute('aria-pressed', String(b.dataset.lens === state.lens));
    document.getElementById('v-gallery').setAttribute('aria-pressed', String(state.view === 'gallery'));
    document.getElementById('v-twin').setAttribute('aria-pressed', String(state.view === 'twin'));
}
function setView(v) {
    state.view = v; syncButtons();
    rail.hidden = v !== 'gallery'; legend.hidden = v !== 'twin'; caption.hidden = v !== 'gallery';
    document.getElementById('replay').hidden = v !== 'twin';
    twinControls.enabled = v === 'twin'; galControls.enabled = v === 'gallery';
    renderPass.scene = v === 'twin' ? twin.scene : gallery.scene;
    renderPass.camera = v === 'twin' ? twinCam : galCam;
    if (v === 'gallery') showMachine();
    makeLabels();
    if (location.hash !== `#${v}`) history.replaceState(null, '', `#${v}`);
    resize();
}
for (const b of document.querySelectorAll('[data-lens]')) b.addEventListener('click', () => { state.lens = b.dataset.lens; syncButtons(); rebuild(); });
document.getElementById('filter').addEventListener('change', (e) => { state.filter = e.target.value; rebuild(); });
document.getElementById('selected').addEventListener('change', (e) => { state.selected = e.target.value; setSelection(); });
document.getElementById('v-gallery').addEventListener('click', () => setView('gallery'));
document.getElementById('v-twin').addEventListener('click', () => setView('twin'));
document.getElementById('replay').addEventListener('click', replay);
addEventListener('hashchange', () => { const v = location.hash.slice(1); if ((v === 'twin' || v === 'gallery') && v !== state.view) setView(v); });

// clicks: plinth band (filter), keystone (panel), levers (actions), machine body (panel), pipe (one move)
document.getElementById('inuse').addEventListener('change', (e) => { state.inUse = e.target.value; });
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null;
canvas.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', (e) => {
    if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
    const r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    raycaster.setFromCamera(ndc, state.view === 'twin' ? twinCam : galCam);
    // machine first: the body filters to its matter, the base opens its panel
    const m = raycaster.intersectObject(state.view === 'twin' ? twin.machines : gallery.turntable, true)[0];
    if (m) {
        const n = NODE[m.object.userData.node];
        if (!n) return;
        if (m.object.userData.part === 'base' && n.vessel && !n.locked) return cycleFilter(n);
        if (n.panel) return toast(`Opens the ${n.panel} panel`);
        return;
    }
    if (state.view !== 'twin') return;
    const p = raycaster.intersectObjects(pipes.filter((q) => q.core).map((q) => q.core))[0];
    if (p) { const q = pipes[p.object.userData.pipe]; launch([{ pipe: q, forward: true }], moveColor(q.from)); }
});
function cycleFilter(n) {
    const next = { undefined: 'include', include: 'exclude', exclude: undefined }[state.stage[n.id]];
    if (next) state.stage[n.id] = next; else delete state.stage[n.id];
    toast(next === 'include' ? `Only ${n.matter}` : next === 'exclude' ? `Not ${n.matter}` : `${n.matter} filter cleared`);
    rebuild();
}
function runAction(n, name) {
    toast(name);
    if (name === 'Harvest') n.spin = 14;
    if (name === 'Feed') launch(route(n.id, 'centrifuge'), n.light);
    if (name === 'Siphon') launch(route('centrifuge', n.id), NODE.centrifuge.light);
    if (name === 'Purge') { NODE.centrifuge.spin = 6; for (let i = 0; i < 4; i++) setTimeout(() => launch(route('centrifuge', 'sump'), NODE.centrifuge.light), i * 180); }
}

function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false); composer.setSize(w, h);
    const aspect = w / h, half = 350;
    twinCam.left = -half * aspect; twinCam.right = half * aspect; twinCam.top = half; twinCam.bottom = -half; twinCam.updateProjectionMatrix();
    galCam.aspect = aspect; galCam.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

const tmp = new THREE.Vector3();
function place(el, at, cam) {
    tmp.copy(at).project(cam);
    const w = stage.clientWidth, h = stage.clientHeight;
    const off = tmp.z > 1 || Math.abs(tmp.x) > 1.1 || Math.abs(tmp.y) > 1.1;
    el.style.display = off ? 'none' : '';
    if (!off) el.style.transform = `translate(${((tmp.x * 0.5 + 0.5) * w).toFixed(1)}px, ${((-tmp.y * 0.5 + 0.5) * h).toFixed(1)}px) translate(-50%, -100%)`;
}
let last = performance.now(), time = 0;
function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const step = reduced ? 0 : dt; time += step;
    stepPipes(dt);   // moves always run: they carry information
    if (state.view === 'twin') {
        for (const f of twin.anims) f(step, time);
        for (const f of twin.machineAnims) f(step, time);
        stepSelection(dt);
        twinControls.update();
        for (const l of twin.labels) if (l.el) place(l.el, l.at, twinCam);
        if (twin.temperLabel) place(twin.temperLabel.el, twin.temperLabel.at, twinCam);
    } else {
        gallery.plinthAnim(step);
        for (const f of gallery.anims) f(step, time);
        gallery.turntable.rotation.y += step * 0.2;
        galControls.update();
    }
    composer.render();
}
syncButtons();
rebuild();
setView(location.hash === '#gallery' ? 'gallery' : 'twin');
requestAnimationFrame(frame);
</script>
