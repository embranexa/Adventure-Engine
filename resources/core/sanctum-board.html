<title>Sanctum Pipe Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: the board fills the width; layouts to compare sit above it, scenarios and the pipe editor below. Dark only, as the app is. */
:root{color-scheme:dark;--abyss:#010203;--plate:#0c0e11;--s2:#2a2e35;--s3:#34383f;--s4:#4a4f58;--text:#e6e8ec;--muted:#a3a9b3;--dim:#868c96;--brass:#c8a46a;--bad:#ff6b6b;--ok:#7fd6a0;--disp:'Saira Condensed','Arial Narrow',sans-serif;--body:Inter,system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}body{background:radial-gradient(1200px 600px at 50% 110%,#07161f,transparent 70%),var(--abyss);color:var(--text);font:14px/1.5 var(--body);scrollbar-color:#34383f transparent}
.wrap{max-width:1320px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1,h2{font-family:var(--disp);font-weight:600;margin:0;text-transform:uppercase}h1{font-size:24px;letter-spacing:.24em}h2{font-size:13px;letter-spacing:.2em;color:var(--muted)}p{margin:0}.small{font-size:12.5px;color:var(--dim)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,input{font:inherit;color:inherit}button{background:rgba(12,13,16,.7);border:1px solid var(--s3);border-radius:99px;padding:6px 14px;cursor:pointer;font:600 13px var(--disp);letter-spacing:.12em;text-transform:uppercase}button:hover:not(:disabled){border-color:#7a808a}button:disabled{opacity:.4;cursor:default}button[aria-pressed=true]{background:#ffffff14;border-color:#9aa0aa}button.go{border-color:var(--brass);color:#f5e6c8}button.x{border-color:transparent;background:none;padding:2px 8px;color:var(--dim)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}select,input[type=text]{background:#08090b;border:1px solid var(--s3);border-radius:4px;padding:6px 8px;min-width:0;max-width:100%}
.tabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}.lt{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 14px;border-radius:8px;background:#0a0b0e;box-shadow:inset 0 0 0 1px var(--s2)}.lt:hover{box-shadow:inset 0 0 0 1px var(--s4)}.lt:focus-visible{outline:2px solid var(--brass)}.lt[aria-pressed=true]{box-shadow:inset 0 0 0 1px var(--brass),0 0 18px #c8a46a22}.lt b{font:600 17px var(--disp);display:block}.lt span{font:12px var(--mono);color:var(--muted)}
.mod{border-radius:14px;padding:6px;background:rgba(17,19,23,.2);box-shadow:0 0 0 1px #000,inset 0 0 0 1px var(--s3),inset 0 0 0 2px #0c0d0f,inset 0 0 0 4px var(--s2),0 24px 60px #000a}.gl{border-radius:9px;background:linear-gradient(#0e1014aa,#040507cc);overflow:hidden}.bar{padding:10px 14px;border-bottom:1px solid #000;background:linear-gradient(#181a1fe0,#0a0b0de0)}
.sc{overflow-x:auto}svg#b{display:block;width:100%;min-width:760px;height:auto;touch-action:pan-x pan-y}.nd{cursor:grab}.nd.pick circle.o{stroke:#fff}.nd text{font:600 12.5px var(--disp);letter-spacing:.06em;fill:#e6e8ec;text-anchor:middle;paint-order:stroke;stroke:#050608;stroke-width:4px;pointer-events:none}.zn{font:600 12px var(--disp);letter-spacing:.24em;fill:#868c96}.pp{cursor:pointer}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px}.pane{background:#06070999;box-shadow:inset 0 0 0 1px var(--s2);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
ul{list-style:none;margin:0;padding:0}.st{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:4px 10px;padding:7px 0;border-top:1px solid var(--s2);align-items:center}.st small{color:var(--dim);font-size:12px}.st.skip{opacity:.45}.no{color:var(--bad)}.yes{color:var(--ok)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}.chip{display:inline-flex;gap:6px;align-items:center;font:500 12.5px var(--body);letter-spacing:0;text-transform:none;padding:3px 10px}
.pl{max-height:380px;overflow:auto;scrollbar-width:thin}.pl li{display:flex;gap:8px;align-items:center;padding:5px 4px;border-top:1px solid var(--s2)}.pl li.sel{background:#ffffff10}.pl button.n{all:unset;cursor:pointer;flex:1;min-width:0;overflow-wrap:anywhere}.pl button.n:focus-visible{outline:2px solid var(--brass)}
textarea{width:100%;height:120px;background:#060709;color:var(--muted);border:1px solid var(--s3);font:11px var(--mono);border-radius:4px}
@media(max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
</style>
<div class="wrap">
<header class="row" style="gap:14px"><h1 style="flex:1 1 300px">Sanctum Pipe Board</h1><button data-a="undo" id="undo">Undo</button><button data-a="dup">Copy as new layout</button><button data-a="reset">Reset all</button></header>
<div class="tabs" id="tabs"></div>
<div class="mod"><div class="gl"><div class="bar row"><button data-a="draw" id="draw" aria-pressed="false">Draw pipe</button><span class="row" id="legend"></span><span class="small" id="hint" style="margin-left:auto"></span></div><div class="sc"><svg id="b" viewBox="0 0 1000 640" role="img" aria-label="Signal chain, seen from above"></svg></div></div></div>
<div class="cols"><section class="pane"><div class="row"><h2 style="flex:1">Scenarios</h2><button data-a="all">Play all</button></div><div class="row" id="scs"></div><ul id="steps"></ul></section>
<section class="pane"><h2 id="ph">Pipes</h2><div id="ed"></div><ul class="pl" id="pl" tabindex="0" aria-label="Pipes"></ul><div class="row"><button class="go" data-a="exp">Copy this layout</button><span class="small" id="cpd"></span></div><div id="ex"></div></section></div>
<p class="small">Machines and gray pipes outside the Sanctum are today’s signal chain at its real positions, with the harvesters shown as one. Nothing here touches the app. Edits are kept in this browser only.</p>
</div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
const K={matter:['Matter','#b9bec7'],entities:['Entities','#5fa8ff'],effects:['Effects','#4fdc8c'],ambrosia:['Ambrosia','#f2c230'],favor:['Favor','#d070ff'],mastery:['Mastery','#ff7f5c']};
const N=(id,label,zone,x,z,o={})=>({id,label,zone,x,z,...o});
const base=()=>[N('harvester','Harvesters','net',-345,-20),N('manifold','Manifold','net',-272,0,{j:1}),N('sieve','Sieve','net',-280,-104,{lock:1}),N('centrifuge','Centrifuge','net',-210,0),N('sump','Sump','net',-205,-122),N('forge','Forge','net',-205,105),N('enricher','Enricher','net',-295,105,{lock:1}),
...[['hopper','Hopper'],['refinery','Refinery'],['alembic','Alembic'],['crucible','Crucible'],['arena','Arena'],['treasury','Treasury'],['archive','Archive']].map(([i,l],k)=>N(i,l,'core',[-110,-40,30,110,180,250,320][k],0)),N('necropolis','Necropolis','core',110,-104),
...[['nexus','Nexus'],['atlas','Atlas'],['calendar','Calendar'],['ledger','Ledger']].map(([i,l],k)=>N(i,l,'gallery',-110+k*430/3,-204))];
const P=(a,b,...c)=>({id:a+'~'+b,a,b,c});
const chain=()=>[P('harvester','manifold','matter'),P('manifold','centrifuge','matter'),P('centrifuge','sump','matter'),P('centrifuge','hopper','matter'),P('forge','hopper','matter'),...['hopper','refinery','alembic','crucible','arena','treasury','archive'].slice(1).map((b,i,a)=>P(['hopper','refinery','alembic','crucible','arena','treasury'][i],b,'matter')),P('crucible','necropolis','matter')];
const sanct=()=>[N('codex','Codex','sanctum',-40,225),N('agora','Agora','sanctum',80,225),N('inventory','Inventory','sanctum',160,225),N('pantheon','Pantheon','sanctum',240,225,{lock:1}),N('mastery','Mastery','sanctum',320,225,{lock:1})];
const codexLinks=()=>[P('codex','refinery','entities'),P('inventory','arena','effects')];
function presets(){return[
{name:'Trunk',nodes:[...base(),...sanct(),N('smanifold','Sanctum manifold','sanctum',200,145,{j:1})],pipes:[...chain(),...codexLinks(),P('crucible','agora','ambrosia'),P('treasury','smanifold','entities','effects','ambrosia','favor'),P('smanifold','codex','entities'),P('smanifold','agora','ambrosia'),P('smanifold','inventory','effects'),P('smanifold','pantheon','favor'),P('arena','mastery','mastery')]},
{name:'Direct pipes',nodes:[...base(),...sanct()],pipes:[...chain(),...codexLinks(),P('crucible','agora','ambrosia'),P('treasury','codex','entities'),P('treasury','inventory','effects'),P('treasury','agora','ambrosia'),P('treasury','pantheon','favor'),P('arena','mastery','mastery')]},
{name:'Today',nodes:[...base(),N('codex','Codex','core',-40,104),N('agora','Entropy Market','core',180,104,{lock:1})],pipes:[...chain(),P('codex','refinery','entities'),P('agora','crucible','ambrosia'),P('agora','arena','ambrosia'),P('agora','treasury','ambrosia')]}]}
/* deliveries: [what, from, to, why]; a fifth item of 1 sends it back up the same route */
const SC=[['Assay','Link entities while classifying',[['matter','hopper','refinery','The adventure arrives'],['entities','codex','refinery','Its entities are linked']]],
['Tick an action','',[['ambrosia','crucible','agora','The action pays its share']]],
['Enter the Arena','',[['matter','crucible','arena','The adventure moves on'],['effects','inventory','arena','Items open locks']]],
['Complete','',[['matter','arena','treasury','It becomes an artifact']]],
['Enshrine','',[['entities','treasury','codex','Discovered entities'],['effects','treasury','inventory','An item’s effects'],['ambrosia','treasury','agora','The larger share'],['favor','treasury','pantheon','Its deities are fed']]],
['Un-complete','',[['matter','treasury','crucible','It goes back'],['ambrosia','treasury','agora','Pay is taken back',1],['favor','treasury','pantheon','Favor is taken back',1],['effects','treasury','inventory','Effects are withdrawn',1]]],
['Kill','',[['matter','alembic','necropolis','It dies']]],
['Live play','Later phase',[['mastery','arena','mastery','A move succeeds and is learned']]],
['New deity','',[['entities','codex','pantheon','The Pantheon learns of it']]],
['New skill','',[['entities','codex','mastery','Mastery learns of it']]],
['Hungry deity','',[['favor','pantheon','refinery','It asks for what would feed it']]]];
let L=presets(),cur=0,sel=null,draw=null,sc=4,skip={},hist=[],drag=null,run=0;
try{const s=JSON.parse(localStorage.getItem('sanctum-board-1'));if(s?.L?.length){L=s.L;cur=Math.min(s.cur||0,L.length-1);skip=s.skip||{}}}catch{}
const save=()=>{try{localStorage.setItem('sanctum-board-1',JSON.stringify({L,cur,skip}))}catch{}},snap=()=>{hist.push(JSON.stringify({L,cur,skip}));if(hist.length>60)hist.shift()};
const lay=()=>L[cur],node=(id,l=lay())=>l.nodes.find(n=>n.id===id),X=n=>(n.x+395)*1.31,Y=n=>(n.z+240)*1.2+16;
function path(p,l=lay(),o=0){const a=node(p.a,l),b=node(p.b,l);let x1=X(a),y1=Y(a),x2=X(b),y2=Y(b);const dx=x2-x1,dy=y2-y1;if(Math.abs(dy)<24){return`M${x1} ${y1+o}L${x2} ${y2+o}`}const m=dy/2;return`M${x1+o} ${y1}C${x1+o} ${y1+m} ${x2+o} ${y2-m} ${x2+o} ${y2}`}
function route(k,from,to,l=lay()){if(!node(from,l)||!node(to,l))return null;const seen={[from]:null},q=[from];while(q.length){const at=q.shift();if(at===to)break;for(const p of l.pipes){if(!p.c.includes(k))continue;let n=null;if(p.a===at)n=p.b;else if(p.b===at&&k==='matter')n=p.a;if(n&&!(n in seen)){seen[n]={p,from:at};q.push(n)}}}if(!(to in seen))return null;const r=[];for(let a=to;seen[a];a=seen[a].from)r.unshift({p:seen[a].p,fwd:seen[a].p.a===seen[a].from});return r}
const key=(s,i)=>SC[s][0]+'/'+i;
function pts(p,l){const a=node(p.a,l),b=node(p.b,l),r=[],x1=X(a),y1=Y(a),x2=X(b),y2=Y(b),m=(y2-y1)/2,flat=Math.abs(y2-y1)<24;for(let i=0;i<=14;i++){const t=i/14,u=1-t;r.push(flat?[x1+(x2-x1)*t,y1+(y2-y1)*t]:[u*u*u*x1+3*u*u*t*x1+3*u*t*t*x2+t*t*t*x2,u*u*u*y1+3*u*u*t*(y1+m)+3*u*t*t*(y2-m)+t*t*t*y2])}return r}
function crossings(l){const Q=l.pipes.map(p=>[p,pts(p,l)]);let n=0;const c=(a,b,d)=>(d[1]-a[1])*(b[0]-a[0])-(b[1]-a[1])*(d[0]-a[0]);for(let i=0;i<Q.length;i++)for(let j=i+1;j<Q.length;j++){const[p,A]=Q[i],[q,B]=Q[j];if([p.a,p.b].some(x=>x===q.a||x===q.b))continue;let hit=0;for(let s=0;s<14&&!hit;s++)for(let t=0;t<14;t++)if(c(A[s],A[s+1],B[t])*c(A[s],A[s+1],B[t+1])<0&&c(B[t],B[t+1],A[s])*c(B[t],B[t+1],A[s+1])<0){hit=1;break}n+=hit}return n}
function score(l){let ok=0,all=0;SC.forEach((s,i)=>s[2].forEach((d,j)=>{if(skip[key(i,j)])return;all++;if(route(d[0],d[1],d[2],l))ok++}));return[ok,all]}
function render(){const l=lay();$('#undo').disabled=!hist.length;$('#draw').setAttribute('aria-pressed',!!draw);
 $('#hint').textContent=draw?(draw.a?`From ${node(draw.a).label}. Choose where it goes.`:'Choose the machine it starts from.'):'Drag machines. Click a pipe to edit it.';
 $('#tabs').innerHTML=L.map((x,i)=>{const[o,a]=score(x);return`<button class="lt" data-a="lay" data-i="${i}" aria-pressed="${i===cur}"><b>${esc(x.name)}</b><span>${o}/${a} deliveries · ${x.pipes.length} pipes · ${crossings(x)} crossings</span></button>`}).join('');
 const pick=sel&&l.pipes.find(p=>p.id===sel);
 $('#legend').innerHTML=Object.entries(K).map(([k,[n,c]])=>`<span class="row small" style="gap:6px;color:#e6e8ec"><i class="dot" style="--c:${c}"></i>${n}</span>`).join('');
 board();
 $('#scs').innerHTML=SC.map((s,i)=>{const bad=s[2].some((d,j)=>!skip[key(i,j)]&&!route(d[0],d[1],d[2]));return`<button class="chip" data-a="sc" data-i="${i}" aria-pressed="${i===sc}">${bad?'<span class="no" aria-label="missing a pipe">✕</span>':'<span class="yes" aria-label="works">✓</span>'} ${s[0]}</button>`}).join('');
 $('#steps').innerHTML=SC[sc][2].map((d,j)=>{const r=route(d[0],d[1],d[2]),sk=skip[key(sc,j)],nm=r&&(d[4]?[...r].reverse():r),to=id=>node(id)?.label??id;let s='';if(r){const ids=[d[1]];r.forEach(x=>ids.push(x.fwd?x.p.b:x.p.a));if(d[4])ids.reverse();s=ids.map(to).join(' → ')}const lk=[d[1],d[2]].map(i=>node(i)).find(n=>n?.lock);return`<li class="st ${sk?'skip':''}"><i class="dot" style="--c:${K[d[0]][1]}"></i><span>${d[3]} <small>${K[d[0]][0]}${lk?` · ${lk.label} is locked`:''}</small><br>${sk?'<small>Not needed</small>':r?`<small>${esc(s)}</small>`:`<small class="no">No pipe carries ${K[d[0]][0].toLowerCase()} from ${esc(to(d[1]))} to ${esc(to(d[2]))}</small>`}</span><button class="x" data-a="skip" data-j="${j}">${sk?'Needed':'Not needed'}</button></li>`}).join('');
 $('#ph').textContent=`Pipes in ${l.name}`;
 $('#ed').innerHTML=pick?`<div class="row"><b>${esc(node(pick.a).label)} → ${esc(node(pick.b).label)}</b><button data-a="flip">Reverse</button><button data-a="del">Delete</button></div><div class="row" style="margin-top:8px">${Object.entries(K).map(([k,[n,c]])=>`<button class="chip" data-a="car" data-k="${k}" aria-pressed="${pick.c.includes(k)}"><i class="dot" style="--c:${c}"></i>${n}</button>`).join('')}</div>`:`<div class="row"><select id="na" aria-label="From">${opts()}</select><span>→</span><select id="nb" aria-label="To">${opts()}</select><select id="nk" aria-label="Carries">${Object.entries(K).map(([k,v])=>`<option value="${k}" ${k==='entities'?'selected':''}>${v[0]}</option>`).join('')}</select><button data-a="add">Add pipe</button></div>`;
 $('#pl').innerHTML=l.pipes.map(p=>`<li class="${p.id===sel?'sel':''}">${p.c.map(k=>`<i class="dot" style="--c:${K[k][1]}" title="${K[k][0]}"></i>`).join('')}<button class="n" data-a="sel" data-id="${p.id}">${esc(node(p.a).label)} → ${esc(node(p.b).label)}</button></li>`).join('');save()}
const opts=()=>lay().nodes.filter(n=>n.zone!=='gallery').map(n=>`<option value="${n.id}">${esc(n.label)}</option>`).join('');
function board(hot=[]){const l=lay();let h='<defs><radialGradient id="g"><stop offset="0" stop-color="#1c2027"/><stop offset="1" stop-color="#08090b"/></radialGradient></defs>';
 for(const[z,lab]of[['net','Net'],['core','Core'],['gallery','Gallery'],['sanctum','Sanctum']]){const ns=l.nodes.filter(n=>n.zone===z);if(!ns.length)continue;const x0=Math.min(...ns.map(X))-44,x1=Math.max(...ns.map(X))+44,y0=Math.min(...ns.map(Y))-50,y1=Math.max(...ns.map(Y))+44;h+=`<rect x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" rx="14" fill="${z==='sanctum'?'#c8a46a0d':'#ffffff05'}" stroke="${z==='sanctum'?'#c8a46a66':'#2a2e35'}"/><text class="zn" x="${x0+12}" y="${y0+18}" ${z==='sanctum'?'style="fill:#c8a46a"':''}>${lab.toUpperCase()}</text>`}
 for(const p of l.pipes){const w=p.c.length;h+=`<g class="pp" data-pipe="${p.id}"><path d="${path(p)}" fill="none" stroke="#0000" stroke-width="${16+w*4}"/><path d="${path(p)}" fill="none" stroke="${p.id===sel?'#fff':'#23272e'}" stroke-width="${5+w*4.5}" stroke-linecap="round"/>${p.c.map((k,i)=>`<path d="${path(p,l,(i-(w-1)/2)*4.5)}" fill="none" stroke="${K[k][1]}" stroke-width="2.4" opacity="${k==='matter'?.55:.95}"/>`).join('')}<path id="rt-${p.id}" d="${path(p)}" fill="none" stroke="none"/></g>`;}
 for(const n of l.nodes){const c=n.zone==='sanctum'?'#c8a46a':n.zone==='core'?'#9aa0aa':'#5c626c',r=n.j?9:19;h+=`<g class="nd ${draw?.a===n.id?'pick':''}" data-node="${n.id}" transform="translate(${X(n)} ${Y(n)})"><circle class="o" r="${r}" fill="url(#g)" stroke="${c}" stroke-width="2" ${n.lock?'stroke-dasharray="4 4"':''}/>${n.j?'':`<circle r="13" fill="none" stroke="${c}" opacity=".5"/><polygon points="0,-11 9.5,5.5 -9.500,5.500" fill="none" stroke="${c}" opacity=".7"/>`}${n.lock?`<g fill="#e6e8ec"><rect x="-5" y="-1" width="10" height="8" rx="1.500"/><path d="M-3-1v-3a3 3 0 0 1 6 0v3" fill="none" stroke="#e6e8ec" stroke-width="1.600"/></g>`:''}<text y="${r+15}">${esc(n.label)}</text></g>`}
 h+='<g id="pk"></g>';$('#b').innerHTML=h}
/* ---- play ---- */
async function play(i){const me=++run;sc=i;render();for(let j=0;j<SC[i][2].length;j++){const d=SC[i][2][j];if(skip[key(i,j)])continue;const r=route(d[0],d[1],d[2]);if(!r){const n=node(d[1]);if(n)await fx(me,n,d);}else await go(me,r,d);if(me!==run)return false}return true}
const frame=(me,ms,f)=>new Promise(res=>{const t0=performance.now(),s=t=>{if(me!==run)return res();const k=Math.max(0,Math.min(1,(t-t0)/ms));f(k);k<1?requestAnimationFrame(s):res()};requestAnimationFrame(s)});
async function fx(me,n,d){await frame(me,700,k=>{$('#pk').innerHTML=`<circle cx="${X(n)}" cy="${Y(n)}" r="${19+k*22}" fill="none" stroke="#ff6b6b" stroke-width="3" opacity="${1-k}"/>`});$('#pk').innerHTML=''}
async function go(me,r,d){const c=K[d[0]][1],S=d[4]?[...r].reverse().map(x=>({p:x.p,fwd:!x.fwd})):r;for(const s of S){const el=document.getElementById('rt-'+s.p.id);if(!el)continue;const len=el.getTotalLength();await frame(me,calm?250:Math.max(350,len*3.6),k=>{const e=document.getElementById('rt-'+s.p.id);if(!e)return;const q=calm?.5:k,at=e.getPointAtLength(len*(s.fwd?q:1-q));$('#pk').innerHTML=`<circle cx="${at.x}" cy="${at.y}" r="13" fill="${c}" opacity=".25"/><circle cx="${at.x}" cy="${at.y}" r="6.500" fill="${c}" stroke="#fff" stroke-width="1.500"/>`})}if($('#pk'))$('#pk').innerHTML=''}
/* ---- edits ---- */
function addPipe(a,b,k){if(a===b)return;const l=lay(),e=l.pipes.find(p=>(p.a===a&&p.b===b));if(e){if(!e.c.includes(k))e.c.push(k);sel=e.id}else{l.pipes.push(P(a,b,k));sel=a+'~'+b}}
const guess=(a,b)=>{for(const s of SC)for(const d of s[2])if((d[1]===a&&d[2]===b)||(d[2]===b&&lay().nodes.find(n=>n.id===a)?.j)||(d[1]===a&&lay().nodes.find(n=>n.id===b)?.j))return d[0];return'entities'};
const A={lay:d=>{cur=+d.i;sel=null;draw=null},sc:d=>{play(+d.i);return 1},all:()=>{(async()=>{for(let i=0;i<SC.length;i++)if(!await play(i))return})();return 1},sel:d=>{sel=sel===d.id?null:d.id},
 draw:()=>{draw=draw?null:{};sel=null},undo:()=>{const s=hist.pop();if(s){({L,cur,skip}=JSON.parse(s));sel=null}},
 dup:()=>{snap();const c=JSON.parse(JSON.stringify(lay()));c.name='Layout '+(L.length+1);L.push(c);cur=L.length-1},reset:()=>{snap();L=presets();cur=0;sel=null;skip={}},
 skip:d=>{snap();const k=key(sc,d.j);skip[k]?delete skip[k]:skip[k]=1},
 del:()=>{snap();lay().pipes=lay().pipes.filter(p=>p.id!==sel);sel=null},flip:()=>{snap();const p=lay().pipes.find(p=>p.id===sel);[p.a,p.b]=[p.b,p.a];p.id=p.a+'~'+p.b;sel=p.id},
 car:d=>{snap();const p=lay().pipes.find(p=>p.id===sel);if(p.c.includes(d.k)){if(p.c.length>1)p.c=p.c.filter(x=>x!==d.k)}else p.c.push(d.k)},
 add:()=>{const a=$('#na').value,b=$('#nb').value;if(a===b)return;snap();addPipe(a,b,$('#nk').value)},
 exp:()=>{const l=lay(),t=JSON.stringify({layout:l.name,machines:l.nodes.filter(n=>n.zone==='sanctum'||n.id==='codex'||n.id==='agora').map(n=>({id:n.id,zone:n.zone,x:Math.round(n.x),z:Math.round(n.z),locked:!!n.lock})),pipes:l.pipes.map(p=>`${p.a} -> ${p.b}: ${p.c.join(', ')}`),notNeeded:Object.keys(skip)},null,1);$('#ex').innerHTML=`<textarea readonly id="ext" aria-label="Layout text">${esc(t)}</textarea>`;const f=()=>{$('#ext').select();$('#cpd').textContent='Select and copy the text below.'};try{navigator.clipboard.writeText(t).then(()=>$('#cpd').textContent='Copied. Paste it to Claude.',f)}catch{f()}return 1}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b){if(b.disabled)return;if(!['sc','all','exp'].includes(b.dataset.a))run++;if(!A[b.dataset.a](b.dataset))render();return}const p=e.target.closest('[data-pipe]');if(p&&!draw){sel=sel===p.dataset.pipe?null:p.dataset.pipe;render()}});
const loc=e=>{const m=$('#b').getScreenCTM().inverse();return new DOMPoint(e.clientX,e.clientY).matrixTransform(m)};
$('#b').addEventListener('pointerdown',e=>{const g=e.target.closest('[data-node]');if(!g)return;run++;const id=g.dataset.node;e.preventDefault();if(draw){if(!draw.a)draw.a=id;else if(draw.a!==id){snap();addPipe(draw.a,id,guess(draw.a,id));draw=null}render();return}const q=loc(e),n=node(id);drag={id,dx:X(n)-q.x,dy:Y(n)-q.y,s:JSON.stringify({L,cur,skip}),moved:false};$('#b').setPointerCapture(e.pointerId)});
$('#b').addEventListener('pointermove',e=>{if(!drag)return;const q=loc(e),n=node(drag.id);if(!drag.moved){hist.push(drag.s);drag.moved=true}n.x=Math.max(-370,Math.min(345,(q.x+drag.dx)/1.31-395));n.z=Math.max(-215,Math.min(255,(q.y+drag.dy-16)/1.2-240));board()});
const end=()=>{if(drag){const m=drag.moved;drag=null;if(m)render()}};$('#b').addEventListener('pointerup',end);$('#b').addEventListener('pointercancel',end);
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if((e.key==='Delete'||e.key==='Backspace')&&sel){A.del();render()}if(e.key==='Escape'){draw=null;sel=null;render()}});
render();
</script>
